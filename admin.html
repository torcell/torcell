<style>
:root{--bg:#0b2b36;--panel:#10384a;--soft:#0d3242;--border:#24505f;--strong:#3d6d7e;--text:#eef4f6;--sub:#a3bcc6;--ok:#43b97f;--warn:#f0a23a;--bad:#ef6a5e;--accent:#4f8fd6;--accent2:#2f6f8f;color-scheme:dark;}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

input,select{background:var(--soft);border:1px solid var(--strong);padding:7px 9px;border-radius:0;min-width:0;}

#cargaGlobal{--H:164px;position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#0b2b36 0%,#13505f 55%,#2f6f8f 100%);}
#cargaGlobal::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 56px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 56px);pointer-events:none;}
#cargaGlobal.cgsale{opacity:0;transition:opacity .35s ease;pointer-events:none;}
#cargaGlobal .cg3{position:relative;width:100%;height:var(--H);}
#cargaGlobal .cgbd{position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#fff;will-change:transform;}
#cargaGlobal .cgfondo{position:absolute;inset:0;background:rgba(255,255,255,.08);transform:scaleY(0);will-change:transform;}
#cargaGlobal .cgin{position:absolute;inset:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;text-align:center;opacity:0;will-change:opacity;}
#cargaGlobal .cgabre .cgbd.cgt{animation:cgSube .5s cubic-bezier(.65,0,.35,1) forwards;}
#cargaGlobal .cgabre .cgbd.cgbt{animation:cgBaja .5s cubic-bezier(.65,0,.35,1) forwards;}
#cargaGlobal .cgabre .cgfondo{animation:cgAbre .5s cubic-bezier(.65,0,.35,1) forwards;}
#cargaGlobal .cgabre .cgin{animation:cgAparece .22s ease .34s forwards;}
#cargaGlobal .cgcierra .cgin{opacity:1;animation:cgDesaparece .2s ease forwards;}
#cargaGlobal .cgcierra .cgbd.cgt{transform:translateY(calc(var(--H) / -2 + 1px));animation:cgSubeR .45s cubic-bezier(.65,0,.35,1) .2s forwards;}
#cargaGlobal .cgcierra .cgbd.cgbt{transform:translateY(calc(var(--H) / 2 - 1px));animation:cgBajaR .45s cubic-bezier(.65,0,.35,1) .2s forwards;}
#cargaGlobal .cgcierra .cgfondo{transform:scaleY(1);animation:cgCierra .45s cubic-bezier(.65,0,.35,1) .2s forwards;}
@keyframes cgSube{from{transform:translateY(0);}to{transform:translateY(calc(var(--H) / -2 + 1px));}}
@keyframes cgBaja{from{transform:translateY(0);}to{transform:translateY(calc(var(--H) / 2 - 1px));}}
@keyframes cgSubeR{from{transform:translateY(calc(var(--H) / -2 + 1px));}to{transform:translateY(0);}}
@keyframes cgBajaR{from{transform:translateY(calc(var(--H) / 2 - 1px));}to{transform:translateY(0);}}
@keyframes cgAbre{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes cgCierra{from{transform:scaleY(1);}to{transform:scaleY(0);}}
@keyframes cgAparece{from{opacity:0;}to{opacity:1;}}
@keyframes cgDesaparece{from{opacity:1;}to{opacity:0;}}
#cargaGlobal small{display:block;font-size:12px;opacity:.8;letter-spacing:1px;text-transform:uppercase;}
#cargaGlobal b{display:block;font-size:24px;line-height:1.2;margin:6px 0 0;}
#cargaGlobal .cgcarga{width:min(280px,76%);margin:20px auto 0;}
#cargaGlobal .cgpista{height:5px;background:rgba(255,255,255,.18);overflow:hidden;}
#cargaGlobal .cgrell{height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#4f8fd6,#ffffff);box-shadow:0 0 8px rgba(111,166,232,.6);}
#cargaGlobal .cgest{margin-top:9px;min-height:16px;font-size:11.5px;letter-spacing:1.4px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;text-align:right;}
#cargaGlobal .cgest.cglisto{text-align:center;font-size:13px;font-weight:700;letter-spacing:.8px;color:#fff;}
#cargaGlobal .cgerr{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;max-width:min(420px,92%);font-size:12.5px;line-height:1.3;font-weight:700;letter-spacing:.2px;opacity:0;text-align:left;color:#ff6b6b;}
#cargaGlobal .cgerr svg{flex:none;}
#cargaGlobal.cgerror .cgerr{opacity:1;transition:opacity .3s ease .1s;}
#cargaGlobal .cgbd,#cargaGlobal .cgin small,#cargaGlobal .cgin b,#cargaGlobal .cgest{transition:color .3s ease,background-color .3s ease;}
#cargaGlobal.cgerror .cgbd{background:#ff5252;box-shadow:0 0 10px rgba(255,82,82,.55);}
#cargaGlobal.cgerror .cgin small,#cargaGlobal.cgerror .cgin b,#cargaGlobal.cgerror .cgest{color:#ff6b6b;}
#cargaGlobal.cgerror .cgin b{text-shadow:0 0 14px rgba(255,82,82,.35);}
#cargaGlobal.cgerror .cgpista{background:rgba(255,82,82,.22);}
#cargaGlobal .cgrell{position:relative;}
#cargaGlobal .cgrell::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ff3d3d,#ff9a9a);box-shadow:0 0 8px rgba(255,82,82,.8);opacity:0;transition:opacity .3s ease;}
#cargaGlobal.cgerror .cgrell::after{opacity:1;}
#cargaGlobal .cgin.cgtiembla{opacity:1;animation:cgTiembla .5s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes cgTiembla{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}
@media(prefers-reduced-motion:reduce){#cargaGlobal .cgin.cgtiembla{animation:none;}}
@media(max-width:480px){#cargaGlobal{--H:196px;}#cargaGlobal b{font-size:20px;}}
@media(prefers-reduced-motion:reduce){#cargaGlobal .cgabre .cgbd,#cargaGlobal .cgabre .cgfondo,#cargaGlobal .cgcierra .cgbd,#cargaGlobal .cgcierra .cgfondo{animation-duration:.01s !important;animation-delay:0s !important;}}

</style>

<body>
<div id="cargaGlobal" role="status" aria-live="polite"><div class="cg3 cgabre" id="cgV3"><div class="cgbd cgt"></div><div class="cgbd cgbt"></div><div class="cgfondo"></div><div class="cgin" id="cgIn"><small>Obra Bellavista, La Florida</small><b id="cgTit">Cargando Panel de Admin</b><div class="cgcarga"><div class="cgpista" role="progressbar" aria-label="Cargando" id="cgPista"><div class="cgrell" id="cgRell"></div></div><div class="cgest" id="cgEst">0%</div></div><div class="cgerr" id="cgErr" aria-live="assertive"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3 22 20.5H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/><path d="M12 9.5v5.2" stroke="currentColor" stroke-width="2.2"/><rect x="11" y="16.4" width="2" height="2" fill="currentColor"/></svg><span id="cgErrTxt"></span></div></div></div></div>

<script>
(function(){
  var el = document.getElementById('cargaGlobal'), v = document.getElementById('cgV3'), rell = document.getElementById('cgRell'), est = document.getElementById('cgEst'), tit = document.getElementById('cgTit');
  var textoBase = tit.textContent;
  var dormir = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var st = {meta: 88, prog: 0, t0: performance.now() + 350, raf: 0, fin: null, err: null, volver: false, cerrando: false};
  // Espera a que terminen las animaciones CSS de un elemento (por evento, no por tiempo). Si ya terminaron, sigue de inmediato.
  function terminadas(nodo){
    return Promise.all((nodo.getAnimations ? nodo.getAnimations({subtree: true}) : []).map(function(a){ return a.finished.catch(function(){}); }));
  }
  function bucle(){
    var t = Math.max(0, performance.now() - st.t0);
    var obj = st.volver ? 0 : st.meta >= 100 ? 100 : (st.err ? 90 : 88) * (1 - Math.exp(-t / 450));
    st.prog += (obj - st.prog) * (st.meta >= 100 ? 0.35 : st.volver ? 0.1 : 0.2);
    if(st.meta >= 100 && st.prog > 99.5) st.prog = 100;
    rell.style.transform = 'scaleX(' + (st.prog / 100) + ')';
    if(!est.classList.contains('cglisto')) est.textContent = Math.round(st.prog) + '%';
    if(st.meta < 100 && !st.err) tit.textContent = t > 9000 ? 'Despertando la base de datos, puede tardar un poco…' : textoBase;
    if(el.isConnected) st.raf = requestAnimationFrame(bucle);
  }
  bucle();
  var abierta = terminadas(v);
  async function paginaLista(){
    var tope = dormir(6000);
    var listo = (async function(){
      if(document.readyState !== 'complete') await new Promise(function(r){ window.addEventListener('load', r, {once: true}); });
      try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
      try{ await Promise.all(Array.prototype.slice.call(document.images).map(function(i){ return i.decode ? i.decode().catch(function(){}) : 0; })); }catch(e){}
      await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
    })();
    await Promise.race([listo, tope]);
  }
  window.CargaPagina = {
    el: el,
    cortar: function(){ if(st.err) return; cancelAnimationFrame(st.raf); if(el.parentNode) el.remove(); },
    error: function(destino, tipo){
      if(st.err) return st.err;
      if(st.cerrando){ location.replace(destino); return Promise.resolve(); }
      st.err = (async function(){
        var TXT = {sesion: 'Ya hay una cuenta activa, volviendo a pantalla de sesión.', permiso: 'No te corresponde estar aquí, volviendo al menú.'};
        document.getElementById('cgErrTxt').textContent = TXT[tipo] || TXT.sesion;
        await abierta;
        st.meta = 88; est.classList.remove('cglisto');
        while(st.prog < 89.4 || st.prog > 91) await dormir(30);
        el.classList.add('cgerror'); document.getElementById('cgIn').classList.add('cgtiembla');
        var pista = document.getElementById('cgPista'); if(pista) pista.setAttribute('aria-label', 'Error');
        await dormir(1500);
        st.volver = true;
        while(st.prog > 0.6) await dormir(30);
        await dormir(250);
        location.replace(destino);
      })();
      return st.err;
    },
    fin: function(){
      if(st.err) return st.err;
      if(st.fin) return st.fin;
      st.fin = (async function(){
        await abierta; await paginaLista();
        if(st.err) return;
        st.meta = 100;
        while(st.prog < 100){ if(st.err) return; await dormir(30); }
        est.textContent = '¡Listo!'; est.classList.add('cglisto'); await dormir(450);
        if(st.err) return;
        st.cerrando = true;
        v.classList.remove('cgabre'); v.classList.add('cgcierra');
        await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
        await terminadas(v);
        el.classList.add('cgsale');
        await new Promise(function(r){ var t = setTimeout(r, 600); el.addEventListener('transitionend', function(){ clearTimeout(t); r(); }, {once: true}); });
        CargaPagina.cortar();
      })();
      return st.fin;
    }
  };
  window.salirConError = function(destino, tipo){ if(tipo && window.CargaPagina && document.getElementById('cargaGlobal') && !st.cerrando) return window.CargaPagina.error(destino, tipo); location.replace(destino); };
  if(window.__gateErr) window.CargaPagina.error(window.__gateErr.d, window.__gateErr.t);
  setTimeout(function(){ if(window.CargaPagina) window.CargaPagina.fin(); }, 25000);
  window.addEventListener('pageshow', function(e){ if(e.persisted) location.reload(); });
})();
</script>

<script>
const DEMO = false;
const DEFAULT_DB_URL = 'https://script.google.com/macros/s/AKfycbyYlsRuk-ptv1FPIQFy4bMoffTfoa39ujpH6CF9isJAdh_Y6zfwfBNyJmTMxcmcJ1LX/exec';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dormir = ms => new Promise(r => setTimeout(r, ms));
function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function hub(){ try{ const t = sessionStorage.getItem('hubSesion') || localStorage.getItem('hubSesion'); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
const SECC = [['panel','Panel de Cerámica y Frague'],['calidad','Control de calidad'],['avance','Dashboard de avance'],['terreno','Jefe de Terreno'],['oficina','Oficina Técnica'],['admin','Panel de Admin']];
const SECC_INV = SECC.filter(x => x[0] !== 'panel' && x[0] !== 'admin');
const ERR = {nombre_repetido:'Ya existe una persona con ese nombre.',nombre_invalido:'El nombre debe tener al menos 2 letras.',fecha_invalida:'Elige una fecha futura.',datos_invalidos:'Datos no válidos. Recarga la lista.',rol_invalido:'Cargo no válido.',sin_sesion:'Tu sesión venció. Vuelve a entrar desde el menú.'};
const fmt = ms => new Date(ms).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
let tTimer = 0;
function toast(t, err){ const e = $('toast'); e.textContent = t; e.className = 'on' + (err ? ' err' : ''); clearTimeout(tTimer); tTimer = setTimeout(() => e.className = '', 2800); }

/* ---------- acceso a datos: real (Apps Script) o demo ---------- */

const ORD_USU = (a, b) => { const o = {1: 0, 2: 1, 4: 2, 6: 3, 5: 4, 3: 5}; return (o[a.rol] ?? 9) - (o[b.rol] ?? 9); }; // admins primero, trabajadores al final

const RD_MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const RD_MC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function rdIso(d){ return d.toISOString().substring(0, 10); }
function rdFecha(s){ return new Date(s + 'T00:00:00Z'); }

function rdLunes(s){ const d = rdFecha(s); return rdSuma(s, -((d.getUTCDay() + 6) % 7)); }

function rendDemo(){
  const nombres = ['Rafael', 'Raymond', 'Luis', 'Pedro', 'Marcos', 'Iván'];
  const factor = [1.25, 1.1, 1, 0.85, 0.6, 0.35];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const lun = rdLunes(rdHoy());
  const trabajadores = nombres.map((nombre, i) => {
    const dias = [], asistencia = [];
    for(let k = 11; k >= 0; k--){
      if(i === 5 && k > 5) continue;
      const l = rdSuma(lun, -7 * k);
      for(let j = 0; j < 6; j++){
        const f = rdSuma(l, j); if(f > rdHoy()) continue;
        if(j === 5){ if(rnd() < 0.25){ asistencia.push({d: f, e: 'P', fr: 1, m: '', s: ''}); dias.push({d: f, cat: 'Cerámica', m2: Math.round(factor[i] * 6 * 10) / 10, n: 1, t: 1, tn: 1}); } continue; }
        const r = rnd();
        if(r < 0.07 + (1 - factor[i]) * 0.1){ asistencia.push({d: f, e: 'F', fr: 0, m: '', s: ''}); continue; }
        if(r < 0.14 + (1 - factor[i]) * 0.1){ asistencia.push({d: f, e: 'S', fr: 0.5, m: 'sin cancha', s: 'medio día'}); dias.push({d: f, cat: 'Cerámica', m2: Math.round(factor[i] * 4 * 10) / 10, n: 1, t: 1, tn: 1}); continue; }
        asistencia.push({d: f, e: 'P', fr: 1, m: '', s: ''});
        dias.push({d: f, cat: 'Cerámica', m2: Math.round(factor[i] * (7 + rnd() * 5) * 10) / 10, n: 1 + Math.round(rnd()), t: Math.round((1.5 / factor[i]) * 10) / 10, tn: 1});
      }
    }
    return {nombre, dias, asistencia};
  });
  return {ok: true, trabajadores, cobertura: {terminadas: 412, conFecha: 388, conM2: 405}, jornada: {entrada: 8, horas: 9}};
}

          + '<details class="rd-h"><summary>Historial</summary>' + hist(f) + '</details></div>';
      }).join('') + '</div>'
      + '<div class="rd-tit">m² por semana del equipo</div><svg viewBox="0 0 ' + W + ' ' + Hh + '" style="width:100%;max-width:900px;height:auto;">' + barras + '</svg>'
      + '<div class="rd-nota"><b>Cómo leer el porcentaje.</b> <b>100%</b> = rindió igual que el promedio del equipo en m² por día trabajado. <b>130%</b> = 30% más que el promedio; <b>70%</b> = 30% menos. Se calcula por día trabajado, así quien faltó no sale perjudicado. Un día que se fueron por falta de cancha no cuenta como falta ni baja el porcentaje (solo se cuenta la parte del día que trabajaron). La <b>asistencia</b> es días trabajados ÷ días que correspondía trabajar. La semana va de lunes a viernes y el sábado solo si alguien fue. Si no hay asistencia registrada, se usan los días con actividad en el panel' + (sinAs ? ' (' + sinAs + ' trabajadores sin asistencia en este período)' : '') + '.</div>';
  }
  ['rdVista', 'rdSem', 'rdMes', 'rdCat'].forEach(id => $(id).addEventListener('change', pintar));
  pintar();
}

/* ---------- vistas ---------- */
let datos = null, tab = 'usuarios';
const main = $('main');
function mostrarPin(nombre, pin, volver){
  main.innerHTML = '<div class="tarjeta pinbox"><div style="color:var(--sub);">PIN de <b style="color:var(--text);">' + esc(nombre) + '</b></div><div class="pin">' + esc(pin) + '</div>'
    + '<div style="font-size:12.5px;color:var(--sub);max-width:420px;margin:0 auto 14px;">Se muestra una sola vez; después queda protegido y nadie puede verlo. Entrégaselo en persona, sin enviarlo por mensaje.</div><button class="btn primary" id="pinOk" type="button">Listo, ya lo anoté</button></div>';
  $('pinOk').addEventListener('click', volver);
}
function vistaUsuarios(){
  datos.usuarios.sort(ORD_USU);
  const filas = datos.usuarios.map((u, i) => {
    const b = u.bloqueo;
    const est = b ? '<span class="pildora bad">Bloqueado ' + (b.permanente ? 'permanente' : 'hasta ' + fmt(b.hasta)) + '</span>' : '<span class="pildora ok">Activo</span>';
    const acc = u.rol === 1 ? '<span class="nota" style="margin:0;">no se puede bloquear</span>'
      : '<button class="btn" data-a="ren" data-i="' + i + '" type="button">Renombrar</button><button class="btn" data-a="car" data-i="' + i + '" type="button">Cargo</button><button class="btn" data-a="pin" data-i="' + i + '" type="button">PIN nuevo</button>' + (b ? '<button class="btn" data-a="des" data-i="' + i + '" type="button">Desbloquear</button>' : '<button class="btn bad" data-a="blq" data-i="' + i + '" type="button">Bloquear</button>');
    return '<div class="fila"><div class="quien2"><b>' + esc(u.nombre || '(sin nombre)') + '</b><small>' + esc(u.cargo) + (b && b.motivo ? ' · ' + esc(b.motivo) : '') + '</small></div>' + est + '<div class="acc">' + acc + '</div><div class="extra" id="ex' + i + '" hidden></div></div>';
  }).join('');
  main.innerHTML = '<h2>Usuarios</h2><p class="nota">Al bloquear, renombrar o cambiar el PIN, la persona sale de inmediato de todos sus aparatos. Los PIN no se pueden ver: solo generar uno nuevo.</p>'
    + '<div style="margin-bottom:12px;"><button class="btn primary" id="nuevoB" type="button">+ Crear usuario</button></div><div class="tarjeta" id="nuevoF" hidden></div><div class="tarjeta">' + filas + '</div>';
  const nf = $('nuevoF');
  $('nuevoB').addEventListener('click', () => {
    nf.hidden = !nf.hidden; if(nf.hidden) return;
    nf.innerHTML = '<div class="fila-f"><input id="nN" placeholder="Nombre y apellido" maxlength="60"><select id="nR"><option value="3">Trabajador</option><option value="2">Supervisor</option><option value="4">Jefe de Terreno</option><option value="5">Calidad</option><option value="6">Oficina Técnica</option></select><button class="btn primary" id="nG" type="button">Crear y generar PIN</button></div>';
    $('nG').addEventListener('click', async () => {
      const nombre = $('nN').value.trim(), rol = Number($('nR').value);
      if(nombre.length < 2){ toast(ERR.nombre_invalido, true); return; }
      if(datos.usuarios.some(u => u.nombre.toLowerCase() === nombre.toLowerCase())){ toast(ERR.nombre_repetido, true); return; }
      const j = await accion('adminCrearUsuario', {nombre, rol}); if(!j) return;
      const r = await api('adminUsuarios'); if(r && r.ok) datos.usuarios = r.usuarios;
      mostrarPin(nombre, j.pin, vistaUsuarios);
    });
  });
  main.querySelectorAll('button[data-a]').forEach(btn => btn.addEventListener('click', () => {
    const u = datos.usuarios[btn.dataset.i], a = btn.dataset.a, ex = $('ex' + btn.dataset.i), base = {fila:u.fila, nombre:u.nombre};
    if(!ex.hidden && ex.dataset.a === a){ ex.hidden = true; return; }
    ex.hidden = false; ex.dataset.a = a;
    if(a === 'ren'){
      ex.innerHTML = '<div class="fila-f"><input id="rN" value="' + esc(u.nombre) + '" maxlength="60"><button class="btn primary" id="rG" type="button">Guardar nombre</button></div><div class="nota" style="margin:6px 0 0;">Sus permisos y bloqueos se mantienen. Saldrá de sus aparatos y tendrá que volver a entrar.</div>';
      $('rG').addEventListener('click', async () => {
        const nuevo = $('rN').value.trim(); if(nuevo.length < 2 || nuevo === u.nombre) return;
        if(datos.usuarios.some(x => x !== u && x.nombre.toLowerCase() === nuevo.toLowerCase())){ toast(ERR.nombre_repetido, true); return; }
        const j = await accion('adminRenombrar', {...base, nuevo}); if(!j) return; u.nombre = nuevo; toast('Nombre cambiado.'); vistaUsuarios();
      });
    } else if(a === 'car'){
      ex.innerHTML = '<div class="fila-f"><span>Cargo de <b>' + esc(u.nombre) + '</b>:</span><select id="cS">' + [[2,'Supervisor'],[3,'Trabajador'],[4,'Jefe de Terreno'],[5,'Calidad'],[6,'Oficina Técnica']].map(([v, n]) => '<option value="' + v + '"' + (v === u.rol ? ' selected' : '') + '>' + n + '</option>').join('') + '</select><button class="btn primary" id="cG" type="button">Guardar cargo</button></div><div class="nota" style="margin:6px 0 0;">Cambian sus secciones base y sale de sus aparatos para volver a entrar.</div>';
      $('cG').addEventListener('click', async () => { const rol = Number($('cS').value); const j = await accion('adminCargo', {...base, rol}); if(!j) return; u.rol = rol; u.cargo = j.cargo; toast('Cargo cambiado.'); vistaUsuarios(); });
    } else if(a === 'pin'){
      ex.innerHTML = '<div class="fila-f"><span>¿Generar un PIN nuevo para <b>' + esc(u.nombre) + '</b>? El anterior deja de servir.</span><button class="btn primary" id="pG" type="button">Sí, generar</button></div>';
      $('pG').addEventListener('click', async () => { const j = await accion('adminPinNuevo', base); if(j) mostrarPin(u.nombre, j.pin, vistaUsuarios); });
    } else if(a === 'blq'){
      const man = new Date(Date.now() + 86400000).toISOString().substring(0, 10);
      ex.innerHTML = '<div class="fila-f"><select id="bT"><option value="t">Temporal, hasta la fecha</option><option value="p">Permanente (hasta que yo lo saque)</option></select><input type="date" id="bF" value="' + man + '" min="' + man + '" style="flex:0 0 auto;"><input id="bM" placeholder="Motivo (opcional)" maxlength="120"><button class="btn bad" id="bG" type="button">Bloquear</button></div>';
      $('bT').addEventListener('change', () => { $('bF').style.display = $('bT').value === 't' ? '' : 'none'; });
      $('bG').addEventListener('click', async () => {
        const perm = $('bT').value === 'p'; let hasta = 0;
        if(!perm){ const v = $('bF').value; if(!v){ toast(ERR.fecha_invalida, true); return; } const [y, m, d] = v.split('-').map(Number); hasta = new Date(y, m-1, d, 23, 59, 59).getTime(); if(hasta <= Date.now()){ toast(ERR.fecha_invalida, true); return; } }
        const j = await accion('adminBloquear', {...base, permanente:perm, hasta, motivo:$('bM').value.trim()}); if(!j) return;
        u.bloqueo = j.bloqueo; toast('Bloqueado.'); vistaUsuarios();
      });
    } else if(a === 'des'){
      (async () => { const j = await accion('adminDesbloquear', base); if(!j) return; u.bloqueo = null; toast('Desbloqueado.'); vistaUsuarios(); })();
    }
  }));
}
async function vistaPermisos(){
  main.innerHTML = '<h2>Permisos</h2><p class="nota">Marca a qué otras secciones puede entrar cada persona, además de las suyas. Los cambios se guardan al marcar.</p><div class="tarjeta" id="pc">Cargando…</div>';
  const j = await api('seccionesListar');
  if(!j || !j.ok){ $('pc').textContent = 'No se pudo cargar. Revisa la conexión y que el script esté publicado.'; return; }
  const us = j.usuarios.filter(u => u.nombre);
  $('pc').innerHTML = '<div style="overflow-x:auto;"><table class="matriz"><thead><tr><th>Persona</th>' + SECC_INV.map(s => '<th>' + s[1] + '</th>').join('') + '<th>Celular / tablet extra</th></tr></thead><tbody>'
    + us.map((u, i) => '<tr><td><b>' + esc(u.nombre) + '</b><br><small>' + esc(u.cargo) + '</small></td>' + SECC_INV.map(([k]) => (u.base.indexOf(k) !== -1 ? '<td><small>incluido</small></td>' : '<td><input type="checkbox" data-u="' + i + '" data-s="' + k + '"' + ((u.extra || []).indexOf(k) !== -1 ? ' checked' : '') + '></td>')).join('')
      + (u.dobleBase ? '<td><small>incluido</small></td>' : '<td><input type="checkbox" data-u="' + i + '" data-d="1"' + (u.doble ? ' checked' : '') + '></td>') + '</tr>').join('') + '</tbody></table></div>';
  $('pc').addEventListener('change', async e => {
    const t = e.target; if(t.dataset.u === undefined) return; const u = us[t.dataset.u]; t.disabled = true;
    if(t.dataset.d){ const r = await accion('dispositivoDobleGuardar', {nombre:u.nombre, doble:t.checked}); t.disabled = false; if(r){ u.doble = r.doble; toast('Permiso guardado.'); } else t.checked = !t.checked; return; }
    const nuevo = (u.extra || []).filter(x => x !== t.dataset.s); if(t.checked) nuevo.push(t.dataset.s);
    const r = await accion('seccionesGuardar', {nombre:u.nombre, extra:nuevo}); t.disabled = false; if(r){ u.extra = r.extra; toast('Permiso guardado.'); } else t.checked = !t.checked;
  });
}
function vistaEncargados(){
  main.innerHTML = '<h2>Encargados</h2><p class="nota">Este nombre aparece en cada botón del menú de inicio.</p><div class="tarjeta">'
    + SECC.map(([k, n]) => '<div class="fila"><label class="quien2" for="e_' + k + '"><b>' + n + '</b></label><input id="e_' + k + '" data-k="' + k + '" value="' + esc(datos.encargados[k] || '') + '" maxlength="60" style="flex:1;min-width:200px;"></div>').join('')
    + '<div style="margin-top:12px;"><button class="btn primary" id="eG" type="button">Guardar y cerrar</button> <button class="btn" id="eC" type="button">Cerrar sin guardar</button></div></div>';
  $('eC').addEventListener('click', () => { location.href = 'index.html?menu=1'; });
  $('eG').addEventListener('click', async () => {
    const enc = {}; main.querySelectorAll('input[data-k]').forEach(i => enc[i.dataset.k] = i.value.trim());
    const j = await accion('adminEncargadosGuardar', {encargados:enc}); if(j){ datos.encargados = j.encargados; toast('Encargados guardados.'); await dormir(700); location.href = 'index.html?menu=1'; }
  });
}
async function vistaRendimiento(){
  main.innerHTML = '<h2>Rendimiento por trabajador</h2><p class="nota">Cuánto rinde cada trabajador por semana, por mes y en total, con m², fechas y asistencia.</p><div class="tarjeta" id="rdCuerpo">Cargando…</div>';
  const j = await api('rendimientoDatos');
  if(!j || !j.ok){ $('rdCuerpo').textContent = 'No se pudo cargar. Revisa la conexión y que el Apps Script esté publicado en la versión 64 o más nueva.'; return; }
  renderRendimiento($('rdCuerpo'), j, esc);
}
function vistaVentanas(){
  main.innerHTML = '<h2>Ventanas</h2><p class="nota">Aquí se decidirá qué ventanas y botones puede ver y abrir cada persona dentro de cada página.</p><div class="proximo">Próximamente. Falta definir la lista de ventanas de cada página que se pueden encender o apagar.</div>';
}
async function ir(t){
  tab = t; document.querySelectorAll('#lado button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if(t === 'usuarios') vistaUsuarios(); else if(t === 'permisos') await vistaPermisos(); else if(t === 'encargados') vistaEncargados(); else if(t === 'rendimiento') await vistaRendimiento(); else vistaVentanas();
}
$('lado').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if(b) ir(b.dataset.t); });
$('irMenu').addEventListener('click', () => { location.href = 'index.html?menu=1'; });
async function iniciar(){
  $('quien').textContent = DEMO ? 'Modo prueba · datos de ejemplo' : ('Admin' + (H && H.nombre ? ' · ' + H.nombre : ''));
  const j = await api('adminUsuarios');
  if(!j || !j.ok){ main.innerHTML = '<div class="tarjeta">No se pudo cargar. Revisa la conexión y que el Apps Script esté publicado en la versión 64 o más nueva.</div>'; if(window.CargaPagina) await CargaPagina.fin(); return; }
  datos = {usuarios:j.usuarios, encargados:j.encargados};
  await ir('usuarios');
  if(window.CargaPagina) await CargaPagina.fin();
}
iniciar();
</script>
