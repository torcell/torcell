<title>Panel de Admin · Obra Bellavista</title>
<style>
:root{--bg:#0b2b36;--panel:#10384a;--soft:#0d3242;--border:#24505f;--strong:#3d6d7e;--text:#eef4f6;--sub:#a3bcc6;--ok:#43b97f;--warn:#f0a23a;--bad:#ef6a5e;--accent:#4f8fd6;--accent2:#2f6f8f;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;}
body{min-height:100vh;}
button,input,select{font:inherit;color:inherit;}
.btn{background:transparent;border:1px solid var(--strong);padding:7px 12px;cursor:pointer;border-radius:0;transition:background .15s,border-color .15s;}
.btn:hover{border-color:#fff;background:rgba(255,255,255,.06);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.1);}
.btn.bad{border-color:var(--bad);color:var(--bad);}
.btn:disabled{opacity:.5;cursor:default;}
input,select{background:var(--soft);border:1px solid var(--strong);padding:7px 9px;border-radius:0;min-width:0;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
header.top{border-bottom:2px solid #fff;background:var(--bg);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
header.top h1{font-size:18px;margin:0;flex:1;min-width:200px;}
header.top h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.quien{font-size:12px;color:var(--sub);}
.cuerpo{display:grid;grid-template-columns:210px 1fr;gap:0;max-width:1100px;margin:0 auto;}
nav.lado{border-right:1px solid var(--border);padding:14px 0;}
nav.lado button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:11px 16px;cursor:pointer;color:var(--sub);}
nav.lado button:hover{color:#fff;background:rgba(255,255,255,.04);}
nav.lado button.on{color:#fff;border-left-color:var(--accent);background:rgba(79,143,214,.12);}
nav.lado button small{display:block;font-size:11px;opacity:.8;margin-top:1px;}
main{padding:18px;min-width:0;}
main h2{margin:0 0 4px;font-size:17px;}
.nota{color:var(--sub);font-size:12.5px;margin:0 0 14px;}
.tarjeta{background:var(--panel);border:1px solid var(--border);border-top:2px solid #fff;padding:14px;margin-bottom:14px;}
.fila{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.fila:first-child{border-top:0;}
.fila .quien2{flex:1;min-width:160px;}
.fila .quien2 b{display:block;}
.fila .quien2 small{color:var(--sub);font-size:11.5px;}
.acc{display:flex;gap:6px;flex-wrap:wrap;}
.pildora{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;border:1px solid var(--strong);color:var(--sub);}
.pildora.bad{border-color:var(--bad);color:var(--bad);}
.pildora.ok{border-color:var(--ok);color:var(--ok);}
.extra{flex-basis:100%;background:var(--soft);border:1px solid var(--border);padding:10px;}
.extra[hidden]{display:none;}
.fila-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.fila-f input{flex:1;min-width:150px;}
.pinbox{text-align:center;padding:18px 10px;}
.pinbox .pin{font-size:38px;font-weight:700;letter-spacing:8px;margin:10px 0;font-variant-numeric:tabular-nums;}
.matriz{width:100%;border-collapse:collapse;}
.matriz th{font-size:11.5px;color:var(--sub);font-weight:600;padding:6px;text-align:center;}
.matriz th:first-child,.matriz td:first-child{text-align:left;}
.matriz td{padding:9px 6px;border-top:1px solid var(--border);text-align:center;}
.matriz td small{color:var(--sub);font-size:11px;}
.matriz input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0;}
.proximo{border:1px dashed var(--strong);padding:16px;color:var(--sub);}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:#fff;color:#0b2b36;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;}
#toast.on{opacity:1;transform:translate(-50%,0);}
#toast.err{background:var(--bad);color:#fff;}
.demo{background:#6b3fa0;color:#fff;text-align:center;padding:7px;font-size:12.5px;}
@media(max-width:760px){
  .cuerpo{grid-template-columns:1fr;}
  nav.lado{display:flex;border-right:0;border-bottom:1px solid var(--border);padding:0;overflow-x:auto;}
  nav.lado button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;width:auto;}
  nav.lado button.on{border-bottom-color:var(--accent);}
  nav.lado button small{display:none;}
  main{padding:14px 12px;}
}
.rd-ctl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--sub);}
.rd-ctl select{margin-left:6px;}
.rd-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:10px;}
.rd-res>div{border:1px solid var(--border);border-top:3px solid var(--accent);padding:9px 11px;}
.rd-res b{display:block;font-size:20px;}.rd-res span{font-size:11.5px;color:var(--sub);}
.rd-dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px;}
.rd-d{border:1px solid var(--border);border-left:5px solid var(--ok,#43a047);padding:7px 10px;}
.rd-d.bad{border-left-color:var(--bad,#c0392b);}
.rd-d small{display:block;font-size:11px;color:var(--sub);}.rd-d b{display:block;font-size:14px;}.rd-d span{font-size:12px;color:var(--sub);}
.rd-tit{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--sub);margin:12px 0 6px;}
.rd-f{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(180px,2fr) 90px 100px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);}
.rd-n small,.rd-d2 small,.rd-s small{display:block;font-size:11px;color:var(--sub);}
.rd-barra{height:9px;background:rgba(127,127,127,.2);margin-bottom:4px;}.rd-barra i{display:block;height:100%;}
.rd-b span{font-size:12px;}
.rd-d2{text-align:center;font-weight:600;}
.rd-s{text-align:center;}
.rd-nota{margin-top:14px;font-size:12px;color:var(--sub);border:1px dashed var(--border-strong,var(--border));padding:9px 11px;}
.rd-vacio{padding:18px;color:var(--sub);border:1px dashed var(--border);text-align:center;}
@media(max-width:700px){.rd-f{grid-template-columns:1fr 1fr;}.rd-b{grid-column:1/-1;order:3}}

@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

#cargaGlobal{--H:164px;position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#0b2b36 0%,#13505f 55%,#2f6f8f 100%);}
#cargaGlobal::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 56px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 56px);pointer-events:none;}
#cargaGlobal.cgsale{opacity:0;transition:opacity .35s ease;pointer-events:none;}
#cargaGlobal .cg3{position:relative;width:100%;height:var(--H);}
#cargaGlobal .cgbd{position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#fff;will-change:transform;}
#cargaGlobal .cgfondo{position:absolute;inset:0;background:rgba(255,255,255,.08);transform:scaleY(0);will-change:transform;}
#cargaGlobal .cgin{position:absolute;inset:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;text-align:center;opacity:0;will-change:opacity;}
#cargaGlobal .cgabre .cgbd.cgt{animation:cgSube .5s cubic-bezier(.65,0,.35,1) forwards;}
#cargaGlobal .cgabre .cgbd.cgbt{animation:cgBaja .5s cubic-bezier(.65,0,.35,1) forwards;}
#cargaGlobal .cgabre .cgfondo{animation:cgAbre .5s cubic-bezier(.65,0,.35,1) forwards;}
#cargaGlobal .cgabre .cgin{animation:cgAparece .22s ease .34s forwards;}
#cargaGlobal .cgcierra .cgin{opacity:1;animation:cgDesaparece .2s ease forwards;}
#cargaGlobal .cgcierra .cgbd.cgt{transform:translateY(calc(var(--H) / -2 + 1px));animation:cgSubeR .45s cubic-bezier(.65,0,.35,1) .2s forwards;}
#cargaGlobal .cgcierra .cgbd.cgbt{transform:translateY(calc(var(--H) / 2 - 1px));animation:cgBajaR .45s cubic-bezier(.65,0,.35,1) .2s forwards;}
#cargaGlobal .cgcierra .cgfondo{transform:scaleY(1);animation:cgCierra .45s cubic-bezier(.65,0,.35,1) .2s forwards;}
@keyframes cgSube{from{transform:translateY(0);}to{transform:translateY(calc(var(--H) / -2 + 1px));}}
@keyframes cgBaja{from{transform:translateY(0);}to{transform:translateY(calc(var(--H) / 2 - 1px));}}
@keyframes cgSubeR{from{transform:translateY(calc(var(--H) / -2 + 1px));}to{transform:translateY(0);}}
@keyframes cgBajaR{from{transform:translateY(calc(var(--H) / 2 - 1px));}to{transform:translateY(0);}}
@keyframes cgAbre{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes cgCierra{from{transform:scaleY(1);}to{transform:scaleY(0);}}
@keyframes cgAparece{from{opacity:0;}to{opacity:1;}}
@keyframes cgDesaparece{from{opacity:1;}to{opacity:0;}}
#cargaGlobal small{display:block;font-size:12px;opacity:.8;letter-spacing:1px;text-transform:uppercase;}
#cargaGlobal b{display:block;font-size:24px;line-height:1.2;margin:6px 0 0;}
#cargaGlobal .cgcarga{width:min(280px,76%);margin:20px auto 0;}
#cargaGlobal .cgpista{height:5px;background:rgba(255,255,255,.18);overflow:hidden;}
#cargaGlobal .cgrell{height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#4f8fd6,#ffffff);box-shadow:0 0 8px rgba(111,166,232,.6);}
#cargaGlobal .cgest{margin-top:9px;min-height:16px;font-size:11.5px;letter-spacing:1.4px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;text-align:right;}
#cargaGlobal .cgest.cglisto{text-align:center;font-size:13px;font-weight:700;letter-spacing:.8px;color:#fff;}
@media(max-width:480px){#cargaGlobal{--H:196px;}#cargaGlobal b{font-size:20px;}}
@media(prefers-reduced-motion:reduce){#cargaGlobal .cgabre .cgbd,#cargaGlobal .cgabre .cgfondo,#cargaGlobal .cgcierra .cgbd,#cargaGlobal .cgcierra .cgfondo{animation-duration:.01s !important;animation-delay:0s !important;}}

</style>

<body>
<div id="cargaGlobal" role="status" aria-live="polite"><div class="cg3 cgabre" id="cgV3"><div class="cgbd cgt"></div><div class="cgbd cgbt"></div><div class="cgfondo"></div><div class="cgin" id="cgIn"><small>Obra Bellavista, La Florida</small><b id="cgTit">Cargando Panel de Admin</b><div class="cgcarga"><div class="cgpista" role="progressbar" aria-label="Cargando" id="cgPista"><div class="cgrell" id="cgRell"></div></div><div class="cgest" id="cgEst">0%</div></div></div></div></div>
<script>
(function(){
  var el = document.getElementById('cargaGlobal'), v = document.getElementById('cgV3'), rell = document.getElementById('cgRell'), est = document.getElementById('cgEst'), tit = document.getElementById('cgTit');
  var textoBase = tit.textContent;
  var dormir = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var st = {meta: 88, prog: 0, t0: performance.now() + 350, raf: 0, fin: null};
  // Espera a que terminen las animaciones CSS de un elemento (por evento, no por tiempo). Si ya terminaron, sigue de inmediato.
  function terminadas(nodo){
    return Promise.all((nodo.getAnimations ? nodo.getAnimations({subtree: true}) : []).map(function(a){ return a.finished.catch(function(){}); }));
  }
  function bucle(){
    var t = Math.max(0, performance.now() - st.t0);
    var obj = st.meta >= 100 ? 100 : 88 * (1 - Math.exp(-t / 450));
    st.prog += (obj - st.prog) * (st.meta >= 100 ? 0.35 : 0.2);
    if(st.meta >= 100 && st.prog > 99.5) st.prog = 100;
    rell.style.transform = 'scaleX(' + (st.prog / 100) + ')';
    if(!est.classList.contains('cglisto')) est.textContent = Math.round(st.prog) + '%';
    if(st.meta < 100) tit.textContent = t > 9000 ? 'Despertando la base de datos, puede tardar un poco…' : textoBase;
    if(el.isConnected) st.raf = requestAnimationFrame(bucle);
  }
  bucle();
  var abierta = terminadas(v);
  async function paginaLista(){
    var tope = dormir(6000);
    var listo = (async function(){
      if(document.readyState !== 'complete') await new Promise(function(r){ window.addEventListener('load', r, {once: true}); });
      try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
      try{ await Promise.all(Array.prototype.slice.call(document.images).map(function(i){ return i.decode ? i.decode().catch(function(){}) : 0; })); }catch(e){}
      await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
    })();
    await Promise.race([listo, tope]);
  }
  window.CargaPagina = {
    el: el,
    cortar: function(){ cancelAnimationFrame(st.raf); if(el.parentNode) el.remove(); },
    fin: function(){
      if(st.fin) return st.fin;
      st.fin = (async function(){
        await abierta; await paginaLista();
        st.meta = 100;
        while(st.prog < 100) await dormir(30);
        est.textContent = '¡Listo!'; est.classList.add('cglisto'); await dormir(450);
        v.classList.remove('cgabre'); v.classList.add('cgcierra');
        await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
        await terminadas(v);
        el.classList.add('cgsale');
        await new Promise(function(r){ var t = setTimeout(r, 600); el.addEventListener('transitionend', function(){ clearTimeout(t); r(); }, {once: true}); });
        CargaPagina.cortar();
      })();
      return st.fin;
    }
  };
  setTimeout(function(){ if(window.CargaPagina) window.CargaPagina.fin(); }, 25000);
  window.addEventListener('pageshow', function(e){ if(e.persisted) location.reload(); });
})();
</script>

<header class="top">
  <h1><small>Obra Bellavista, La Florida</small>Panel de Admin</h1>
  <span class="quien" id="quien"></span>
  <button class="btn" id="irMenu" type="button">🔀 Cambiar de sección</button>
</header>
<div class="cuerpo">
  <nav class="lado" id="lado">
    <button type="button" data-t="usuarios" class="on">Usuarios<small>crear, renombrar, bloquear</small></button>
    <button type="button" data-t="permisos">Permisos<small>secciones y aparatos</small></button>
    <button type="button" data-t="encargados">Encargados<small>quién responde por cada página</small></button>
    <button type="button" data-t="rendimiento">Rendimiento<small>m² y actividad por trabajador</small></button>
    <button type="button" data-t="ventanas">Ventanas<small>qué puede abrir cada uno</small></button>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
const DEMO = false;
const DEFAULT_DB_URL = 'https://script.google.com/macros/s/AKfycbyYlsRuk-ptv1FPIQFy4bMoffTfoa39ujpH6CF9isJAdh_Y6zfwfBNyJmTMxcmcJ1LX/exec';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dormir = ms => new Promise(r => setTimeout(r, ms));
function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function hub(){ try{ const t = sessionStorage.getItem('hubSesion') || localStorage.getItem('hubSesion'); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
const SECC = [['panel','Panel de Cerámica y Frague'],['calidad','Control de calidad'],['avance','Dashboard de avance'],['terreno','Jefe de Terreno'],['oficina','Oficina Técnica'],['admin','Panel de Admin']];
const SECC_INV = SECC.filter(x => x[0] !== 'panel' && x[0] !== 'admin');
const ERR = {nombre_repetido:'Ya existe una persona con ese nombre.',nombre_invalido:'El nombre debe tener al menos 2 letras.',fecha_invalida:'Elige una fecha futura.',datos_invalidos:'Datos no válidos. Recarga la lista.',rol_invalido:'Cargo no válido.',sin_sesion:'Tu sesión venció. Vuelve a entrar desde el menú.'};
const fmt = ms => new Date(ms).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
let tTimer = 0;
function toast(t, err){ const e = $('toast'); e.textContent = t; e.className = 'on' + (err ? ' err' : ''); clearTimeout(tTimer); tTimer = setTimeout(() => e.className = '', 2800); }

/* ---------- acceso a datos: real (Apps Script) o demo ---------- */
const H = hub(), TOKEN = H && H.token || '', DB_URL = ls('progresoObraDbUrl') || DEFAULT_DB_URL;
const BD = (function(){
  const g = () => { try{ return JSON.parse(ls('pruebaAdminHtml')); }catch(e){ return null; } };
  const estado = g() || {
    usuarios:[{fila:2,nombre:'Silvia Gonzales',cargo:'Calidad',rol:5,bloqueo:null,base:['calidad'],extra:[],doble:true,dobleBase:true},
      {fila:3,nombre:'Sandoval',cargo:'Jefe de Terreno',rol:4,bloqueo:null,base:['terreno','calidad','avance'],extra:[],doble:false},
      {fila:4,nombre:'Edwin Carroz',cargo:'Oficina Técnica',rol:6,bloqueo:null,base:['oficina','avance'],extra:[],doble:false},
      {fila:5,nombre:'Rafael',cargo:'Trabajador',rol:3,bloqueo:{permanente:false,hasta:Date.now()+3*86400000,motivo:'Vacaciones'},base:['panel'],extra:[],doble:false}],
    encargados:{panel:'Ismael S.',calidad:'Silvia Gonzales',avance:'A. Sandoval',terreno:'A. Sandoval',oficina:'Edwin Carroz',admin:'Ismael S.'}};
  const guardar = () => { try{ localStorage.setItem('pruebaAdminHtml', JSON.stringify(estado)); }catch(e){} };
  const CARGO = {2:'Supervisor',3:'Trabajador',4:'Jefe de Terreno',5:'Calidad',6:'Oficina Técnica'};
  const BASE = {2:['panel'],3:['panel'],4:['terreno','calidad','avance'],5:['calidad'],6:['oficina','avance']};
  const pin = () => String(100000 + Math.floor(Math.random()*899999));
  const por = f => estado.usuarios.find(u => u.fila === f);
  return async function(a, x){
    await dormir(120);
    if(a === 'rendimientoDatos') return rendDemo();
    if(a === 'adminUsuarios') return {ok:true, usuarios:estado.usuarios, encargados:estado.encargados};
    if(a === 'seccionesListar') return {ok:true, usuarios:estado.usuarios.filter(u => u.rol !== 1)};
    if(a === 'seccionesGuardar'){ const u = estado.usuarios.find(v => v.nombre === x.nombre); u.extra = x.extra; guardar(); return {ok:true, extra:u.extra}; }
    if(a === 'dispositivoDobleGuardar'){ const u = estado.usuarios.find(v => v.nombre === x.nombre); u.doble = !!x.doble; guardar(); return {ok:true, doble:u.doble}; }
    if(a === 'adminCrearUsuario'){
      if(estado.usuarios.some(u => u.nombre.toLowerCase() === x.nombre.toLowerCase())) return {ok:false,error:'nombre_repetido'};
      estado.usuarios.push({fila:estado.usuarios.length+2,nombre:x.nombre,cargo:CARGO[x.rol],rol:x.rol,bloqueo:null,base:BASE[x.rol]||['panel'],extra:[],doble:false}); guardar(); return {ok:true,pin:pin()};
    }
    if(a === 'adminCargo'){ const u = por(x.fila); u.rol = x.rol; u.cargo = CARGO[x.rol]; u.base = BASE[x.rol]; guardar(); return {ok:true,rol:x.rol,cargo:u.cargo}; }
    if(a === 'adminRenombrar'){ por(x.fila).nombre = x.nuevo; guardar(); return {ok:true,nombre:x.nuevo}; }
    if(a === 'adminPinNuevo') return {ok:true,pin:pin()};
    if(a === 'adminBloquear'){ const b = {permanente:!!x.permanente,hasta:x.hasta||0,motivo:x.motivo||''}; por(x.fila).bloqueo = b; guardar(); return {ok:true,bloqueo:b}; }
    if(a === 'adminDesbloquear'){ por(x.fila).bloqueo = null; guardar(); return {ok:true}; }
    if(a === 'adminEncargadosGuardar'){ Object.assign(estado.encargados, x.encargados); guardar(); return {ok:true,encargados:estado.encargados}; }
    return {ok:false};
  };
})();
async function api(a, x){
  if(DEMO) return BD(a, x || {});
  try{
    const r = await fetch(DB_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:a, token:TOKEN, ...(x||{})})});
    const j = JSON.parse(await r.text());
    if(j && j.error === 'sin_sesion'){ try{ sessionStorage.setItem('progresoObraAvisoGate','Tu sesión venció. Entra de nuevo.'); }catch(e){} location.replace('index.html?menu=1'); }
    return j;
  }catch(e){ return null; }
}
async function accion(a, x){
  const j = await api(a, x);
  if(j && j.ok) return j;
  toast((j && ERR[j.error]) || 'No se pudo guardar. ¿Está publicada la versión 63 del script?', true);
  return null;
}

/* ===== Rendimiento por trabajador (compartido: panel y admin) ===== */
function rendDemo(){
  const nombres = ['Rafael Soto', 'Jorge Díaz', 'Luis Mella', 'Pedro Araya', 'Marcos Vera', 'Iván Rojas'];
  const factor = [1.25, 1.1, 1, 0.85, 0.6, 0.35];
  const hoy = new Date(); const lun = new Date(Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())); lun.setUTCDate(lun.getUTCDate() - ((lun.getUTCDay() + 6) % 7));
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const trabajadores = nombres.map((nombre, i) => {
    const semanas = [];
    for(let k = 11; k >= 0; k--){
      const d = new Date(lun); d.setUTCDate(d.getUTCDate() - 7 * k);
      if(i === 5 && k > 5) continue;
      const m2 = Math.round(factor[i] * (38 + rnd() * 26) * 10) / 10;
      semanas.push({s: d.toISOString().substring(0, 10), cat: 'Cerámica', m2: m2, n: Math.max(1, Math.round(m2 / 9)), d: Math.max(1, Math.min(6, Math.round(2 + factor[i] * 2.2 + rnd() * 1.5))), t: Math.round((1.5 / factor[i]) * 10) / 10 * Math.max(1, Math.round(m2 / 9)), tn: Math.max(1, Math.round(m2 / 9))});
    }
    return {nombre, semanas};
  });
  return {ok: true, trabajadores, cobertura: {terminadas: 412, conFecha: 388, conM2: 405}};
}
function renderRendimiento(raiz, datos, esc){
  const fmt = n => (Math.round(n * 10) / 10).toLocaleString('es-CL');
  const semanasAll = Array.from(new Set(datos.trabajadores.flatMap(t => t.semanas.map(w => w.s)))).sort();
  raiz.innerHTML = '<div class="rd-ctl"><label>Período <select id="rdPer"><option value="4">Últimas 4 semanas</option><option value="8" selected>Últimas 8 semanas</option><option value="12">Últimas 12 semanas</option><option value="0">Todo</option></select></label>'
    + '<label>Categoría <select id="rdCat"><option value="">Cerámica y Frague</option><option value="Cerámica">Cerámica</option><option value="Frague">Frague</option></select></label></div><div id="rdOut"></div>';
  const out = raiz.querySelector('#rdOut');
  function pintar(){
    const n = Number(raiz.querySelector('#rdPer').value), cat = raiz.querySelector('#rdCat').value;
    const hoyLun = (() => { const d = new Date(); const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); u.setUTCDate(u.getUTCDate() - ((u.getUTCDay() + 6) % 7)); return u; })();
    const lista = []; const total = n || Math.max(1, semanasAll.length);
    let desde = semanasAll[0] || ''; 
    if(n){ for(let k = n - 1; k >= 0; k--){ const d = new Date(hoyLun); d.setUTCDate(d.getUTCDate() - 7 * k); lista.push(d.toISOString().substring(0, 10)); } }
    else { if(semanasAll.length){ const a = new Date(semanasAll[0] + 'T00:00:00Z'); while(a <= hoyLun){ lista.push(a.toISOString().substring(0, 10)); a.setUTCDate(a.getUTCDate() + 7); } } }
    const filas = datos.trabajadores.map(t => {
      const por = {}; lista.forEach(s => por[s] = {m2: 0, n: 0, d: 0, t: 0, tn: 0});
      t.semanas.forEach(w => { if(por[w.s] && (!cat || w.cat === cat)){ const p = por[w.s]; p.m2 += w.m2; p.n += w.n; p.d = Math.max(p.d, w.d); p.t += w.t; p.tn += w.tn; } });
      const serie = lista.map(s => por[s].m2);
      const m2 = serie.reduce((a, b) => a + b, 0), partidas = lista.reduce((a, s) => a + por[s].n, 0);
      const dias = lista.reduce((a, s) => a + por[s].d, 0), semAct = lista.filter(s => por[s].m2 > 0 || por[s].d > 0).length;
      const tt = lista.reduce((a, s) => a + por[s].t, 0), tn = lista.reduce((a, s) => a + por[s].tn, 0);
      const mitad = Math.floor(serie.length / 2), a1 = serie.slice(0, mitad).reduce((x, y) => x + y, 0), a2 = serie.slice(mitad).reduce((x, y) => x + y, 0);
      return {nombre: t.nombre, m2, partidas, dias, semAct, serie, porSem: m2 / lista.length, tiempo: tn ? tt / tn : null, tend: a1 > 0 ? (a2 - a1) / a1 : (a2 > 0 ? 1 : 0)};
    });
    if(!filas.some(f => f.m2 > 0 || f.dias > 0)){ out.innerHTML = '<div class="rd-vacio">Todavía no hay trabajo terminado con fecha en este período.</div>'; return; }
    filas.sort((a, b) => b.m2 - a.m2);
    const activos = filas.filter(f => f.m2 > 0), prom = activos.reduce((a, f) => a + f.m2, 0) / Math.max(1, activos.length), maxM2 = Math.max(1, ...filas.map(f => f.m2));
    const totalM2 = filas.reduce((a, f) => a + f.m2, 0);
    const porDias = filas.slice().sort((a, b) => b.dias - a.dias);
    const sem = lista.map((s, i) => datos.trabajadores.reduce((a, t) => a + t.semanas.filter(w => w.s === s && (!cat || w.cat === cat)).reduce((x, w) => x + w.m2, 0), 0));
    const maxS = Math.max(1, ...sem), W = 900, Hh = 130, bw = W / sem.length;
    const barras = sem.map((v, i) => { const h = v / maxS * (Hh - 22); return '<rect x="' + (i * bw + 4) + '" y="' + (Hh - 16 - h) + '" width="' + Math.max(4, bw - 8) + '" height="' + h + '" fill="var(--accent)"><title>Semana del ' + lista[i].split('-').reverse().join('-') + ': ' + fmt(v) + ' m²</title></rect>'
      + (sem.length <= 14 ? '<text x="' + (i * bw + bw / 2) + '" y="' + (Hh - 3) + '" font-size="9" text-anchor="middle" fill="var(--sub)">' + lista[i].substring(8) + '/' + lista[i].substring(5, 7) + '</text>' : ''); }).join('');
    const spark = serie => { const m = Math.max(1, ...serie), p = serie.map((v, i) => (serie.length > 1 ? i / (serie.length - 1) * 78 : 39).toFixed(1) + ',' + (22 - v / m * 20).toFixed(1)).join(' '); return '<svg viewBox="0 0 80 24" width="80" height="24" aria-hidden="true"><polyline points="' + p + '" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>'; };
    const color = pct => pct >= 100 ? 'var(--ok,#43a047)' : pct >= 70 ? 'var(--warn,#d99a00)' : 'var(--bad,#c0392b)';
    const cob = datos.cobertura || {};
    out.innerHTML = '<div class="rd-res"><div><b>' + fmt(totalM2) + ' m²</b><span>del equipo en el período</span></div><div><b>' + fmt(prom / lista.length) + ' m²</b><span>promedio por trabajador por semana</span></div><div><b>' + activos.length + ' de ' + filas.length + '</b><span>trabajadores con m² en el período</span></div></div>'
      + '<div class="rd-dest"><div class="rd-d ok"><small>Más rinde</small><b>' + esc(filas[0].nombre) + '</b><span>' + fmt(filas[0].m2) + ' m²</span></div><div class="rd-d bad"><small>Menos rinde</small><b>' + esc(filas[filas.length - 1].nombre) + '</b><span>' + fmt(filas[filas.length - 1].m2) + ' m²</span></div>'
      + '<div class="rd-d ok"><small>Más días con actividad</small><b>' + esc(porDias[0].nombre) + '</b><span>' + porDias[0].dias + ' días</span></div><div class="rd-d bad"><small>Menos días con actividad</small><b>' + esc(porDias[porDias.length - 1].nombre) + '</b><span>' + porDias[porDias.length - 1].dias + ' días</span></div></div>'
      + '<div class="rd-tit">Ranking</div><div class="rd-tabla">' + filas.map((f, i) => {
        const pct = prom ? f.m2 / prom * 100 : 0, flecha = f.tend > 0.1 ? '<span style="color:var(--ok,#43a047)">▲ ' + Math.round(f.tend * 100) + '%</span>' : f.tend < -0.1 ? '<span style="color:var(--bad,#c0392b)">▼ ' + Math.abs(Math.round(f.tend * 100)) + '%</span>' : '<span style="color:var(--sub)">= estable</span>';
        return '<div class="rd-f"><div class="rd-n"><b>' + (i + 1) + '. ' + esc(f.nombre) + '</b><small>' + f.partidas + ' partidas · ' + f.semAct + ' de ' + lista.length + ' semanas con actividad' + (f.tiempo != null ? ' · ' + fmt(f.tiempo) + ' días por partida' : '') + (f.m2 ? '' : ' · sin m² en el período') + '</small></div>'
          + '<div class="rd-b"><div class="rd-barra"><i style="width:' + (f.m2 / maxM2 * 100) + '%;background:' + color(pct) + '"></i></div><span>' + fmt(f.m2) + ' m² · <b style="color:' + color(pct) + '">' + Math.round(pct) + '%</b> del promedio</span></div>'
          + '<div class="rd-d2">' + f.dias + ' días<small>con actividad</small></div><div class="rd-s">' + spark(f.serie) + '<small>' + flecha + '</small></div></div>';
      }).join('') + '</div>'
      + '<div class="rd-tit">m² por semana del equipo</div><svg viewBox="0 0 ' + W + ' ' + Hh + '" style="width:100%;max-width:900px;height:auto;">' + barras + '</svg>'
      + '<div class="rd-nota"><b>Sobre los datos.</b> Los m² y las fechas salen de lo que se marca como terminado en el panel' + (cob.terminadas ? ' (' + cob.conFecha + ' de ' + cob.terminadas + ' partidas terminadas tienen fecha; ' + cob.conM2 + ' tienen m²)' : '') + '. Las partidas sin fecha no entran en el cálculo. «Días con actividad» cuenta los días en que se marcó una partida o un terminado del trabajador: <b>no es asistencia real</b>, porque hoy el sistema no registra quién fue a trabajar cada día.</div>';
  }
  raiz.querySelector('#rdPer').addEventListener('change', pintar); raiz.querySelector('#rdCat').addEventListener('change', pintar);
  pintar();
}

  main.querySelectorAll('button[data-a]').forEach(btn => btn.addEventListener('click', () => {
    const u = datos.usuarios[btn.dataset.i], a = btn.dataset.a, ex = $('ex' + btn.dataset.i), base = {fila:u.fila, nombre:u.nombre};
    if(!ex.hidden && ex.dataset.a === a){ ex.hidden = true; return; }
