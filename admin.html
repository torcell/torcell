.btn{background:transparent;border:1px solid var(--strong);padding:7px 12px;cursor:pointer;border-radius:0;transition:background .15s,border-color .15s;}
.btn:hover{border-color:#fff;background:rgba(255,255,255,.06);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.1);}
.btn.bad{border-color:var(--bad);color:var(--bad);}
.btn:disabled{opacity:.5;cursor:default;}
input,select{background:var(--soft);border:1px solid var(--strong);padding:7px 9px;border-radius:0;min-width:0;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
header.top{border-bottom:2px solid #fff;background:var(--bg);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
header.top h1{font-size:18px;margin:0;flex:1;min-width:200px;}
header.top h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.quien{font-size:12px;color:var(--sub);}
.cuerpo{display:grid;grid-template-columns:210px 1fr;gap:0;max-width:1100px;margin:0 auto;}
nav.lado{border-right:1px solid var(--border);padding:14px 0;}
nav.lado button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:11px 16px;cursor:pointer;color:var(--sub);}
nav.lado button:hover{color:#fff;background:rgba(255,255,255,.04);}
nav.lado button.on{color:#fff;border-left-color:var(--accent);background:rgba(79,143,214,.12);}
nav.lado button small{display:block;font-size:11px;opacity:.8;margin-top:1px;}
main{padding:18px;min-width:0;}
.sg-al{border-left:4px solid var(--sub);padding:6px 10px;margin:0 0 8px;background:var(--soft);}
.sg-al.alta{border-left-color:var(--bad);}.sg-al.media{border-left-color:var(--warn);}
.sg-al .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;}.sg-al small{color:var(--sub);}.sg-via{border:1px solid var(--sub);padding:0 5px;font-size:11px;}
.sg-lista{max-height:340px;overflow-y:auto;overscroll-behavior:contain;}
.vel{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;}
.vel .ven{background:var(--panel);border:1px solid var(--strong);max-width:440px;width:100%;padding:18px;animation:abreV .18s ease;transform-origin:top;}
@keyframes abreV{from{opacity:0;transform:scaleY(.94);}to{opacity:1;transform:none;}}
.vel .acc2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.gen-fr{display:block;width:100%;height:600px;overflow:hidden;border:0;background:#0d1b24;opacity:0;transition:opacity .25s ease;}
.gen-fr.listo{opacity:1;}
main h2{margin:0 0 4px;font-size:17px;}
.nota{color:var(--sub);font-size:12.5px;margin:0 0 14px;}
.tarjeta{background:var(--panel);border:1px solid var(--border);border-top:2px solid #fff;padding:14px;margin-bottom:14px;}
.fila{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.fila:first-child{border-top:0;}
.fila .quien2{flex:1;min-width:160px;}
.fila .quien2 b{display:block;}
.fila .quien2 small{color:var(--sub);font-size:11.5px;}
.acc{display:flex;gap:6px;flex-wrap:wrap;}
.pildora{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;border:1px solid var(--strong);color:var(--sub);}
.pildora.bad{border-color:var(--bad);color:var(--bad);}
.pildora.ok{border-color:var(--ok);color:var(--ok);}
.extra{flex-basis:100%;background:var(--soft);border:1px solid var(--border);padding:10px;}
.extra[hidden]{display:none;}
.fila-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.fila-f input{flex:1;min-width:150px;}
.pinbox{text-align:center;padding:18px 10px;}
.pinbox .pin{font-size:38px;font-weight:700;letter-spacing:8px;margin:10px 0;font-variant-numeric:tabular-nums;}
.matriz{width:100%;border-collapse:collapse;}
.matriz th{font-size:11.5px;color:var(--sub);font-weight:600;padding:6px;text-align:center;}
.matriz th:first-child,.matriz td:first-child{text-align:left;}
.matriz td{padding:9px 6px;border-top:1px solid var(--border);text-align:center;}
.matriz td small{color:var(--sub);font-size:11px;}
.matriz input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0;}
.proximo{border:1px dashed var(--strong);padding:16px;color:var(--sub);}
.demo{background:#6b3fa0;color:#fff;text-align:center;padding:7px;font-size:12.5px;}
@media(max-width:760px){
  .cuerpo{grid-template-columns:1fr;}
  nav.lado{display:flex;border-right:0;border-bottom:1px solid var(--border);padding:0;overflow-x:auto;}
  nav.lado button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;width:auto;}
  nav.lado button.on{border-bottom-color:var(--accent);}
  nav.lado button small{display:none;}
  main{padding:14px 12px;}
}
.rd-ctl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--sub);}
.rd-ctl select{margin-left:6px;}
.rd-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:10px;}
.rd-res>div{border:1px solid var(--border);border-top:3px solid var(--accent);padding:9px 11px;}
.rd-res b{display:block;font-size:20px;}.rd-res span{font-size:11.5px;color:var(--sub);}
.rd-dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px;}
.rd-d{border:1px solid var(--border);border-left:5px solid var(--ok,#43a047);padding:7px 10px;}
.rd-d.bad{border-left-color:var(--bad,#c0392b);}
.rd-d small{display:block;font-size:11px;color:var(--sub);}.rd-d b{display:block;font-size:14px;}.rd-d span{font-size:12px;color:var(--sub);}
.rd-tit{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--sub);margin:12px 0 6px;}
.rd-f{display:grid;grid-template-columns:minmax(220px,2.2fr) minmax(150px,1.4fr) 80px 90px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);}
.rd-mm b{color:var(--text);font-weight:600;}
.rd-ctl input{margin-left:6px;font:inherit;}
.rd-n small,.rd-d2 small,.rd-s small{display:block;font-size:11px;color:var(--sub);}
.rd-barra{height:9px;background:rgba(127,127,127,.2);margin-bottom:4px;}.rd-barra i{display:block;height:100%;}
.rd-dud{color:#c98a00;}.rd-dif{display:inline-block;margin-left:6px;padding:0 6px;font-weight:700;font-size:11.5px;line-height:18px;border:1px solid currentColor;cursor:help;}.rd-dif.up{color:var(--ok,#43a047);}.rd-dif.down{color:var(--bad,#c0392b);}.rd-dif.eq{color:var(--sub);}.rd-b span{font-size:12px;}.rd-b .rd-sm,.rd-b .rd-sd{display:block;font-size:12px;line-height:1.35;}.rd-b .rd-sd{color:var(--sub);}.rd-nota summary{cursor:pointer;font-weight:600;}
.rd-d2{text-align:center;font-weight:600;}
.rd-s{text-align:center;}
.rd-nota{margin-top:14px;font-size:12px;color:var(--sub);border:1px dashed var(--border-strong,var(--border));padding:9px 11px;}
.rd-vacio{padding:18px;color:var(--sub);border:1px dashed var(--border);text-align:center;}
@media(max-width:700px){.rd-f{grid-template-columns:1fr 1fr;}.rd-b{grid-column:1/-1;order:3}}
.rd-sub{font-size:12px;color:var(--sub);margin:-2px 0 8px;}
.rd-fr b{font-weight:700;}
.rd-hbtn{font:inherit;cursor:pointer;font-size:12px;color:var(--accent);background:none;border:1px solid var(--border);padding:4px 8px;width:100%;text-align:center;border-radius:0;}
.rd-hbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.rd-hp{padding:2px 0 10px;}
.rd-hp[hidden]{display:none;}
.rd-hv{font-size:12px;color:var(--sub);padding:4px 0;}
.rd-hl{display:grid;grid-template-columns:92px 140px 108px 1fr;gap:4px 12px;align-items:baseline;font-size:12.5px;padding:6px 0;border-top:1px dashed var(--border);}
.rd-hl .hm{text-align:right;font-variant-numeric:tabular-nums;}
.rd-hl .hs{font-weight:600;}
.rd-hl .hr,.rd-hl .ha{color:var(--sub);}
.rd-hl .ha.sin{font-style:italic;}
.rd-hl small{grid-column:2/-1;font-size:11px;color:var(--sub);}
@media(max-width:700px){.rd-hl{grid-template-columns:80px 1fr;}.rd-hl .ha,.rd-hl small{grid-column:1/-1;}}

/* ===== Aviso lateral · v1 ===== */
/* se abre del centro hacia los lados y se cierra igual */

/* ===== colores por tipo ===== */
.avl         { --av: #2fa3b8; }   /* info */
.avl.exito   { --av: #34a874; }
.avl.alerta  { --av: #d99a1c; }
.avl.error   { --av: #d6455a; }

/* ===== contenedor (arriba al centro) ===== */
.avls {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%); z-index: 9999;
  width: min(440px, calc(100vw - 32px));
  display: grid; gap: 10px; pointer-events: none;
}

/* ===== aviso ===== */
.avl {
  position: relative; pointer-events: auto;
  display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; gap: 12px;   /* el relleno de 26px iguala a la X: lo del medio queda centrado */
  padding: 12px 12px 14px 16px;
  background: var(--panel, #fff); color: var(--text, #2c302c);
  border: 1px solid var(--border-strong, var(--strong, #b9bdb3)); border-radius: 0;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  font: 500 14px/1.4 "Noto Sans", "Segoe UI", system-ui, sans-serif;
}
/* líneas de arriba y abajo que se apagan hacia los lados */
.avl::before, .avl::after {
  content: ""; position: absolute; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, var(--av) 30%, var(--av) 50%, var(--av) 70%, transparent);
}
.avl::before { top: -1px; }
.avl::after  { bottom: -1px; }

.avl .icono { width: 22px; height: 22px; display: grid; place-items: center; color: var(--av); }
.avl .icono svg { width: 20px; height: 20px; }
.avl .cont { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; text-align: center; }
.avl .icono { flex: 0 0 auto; }
.avl .texto { min-width: 0; overflow-wrap: anywhere; line-height: 22px; }
.avl .cerrar {
  width: 26px; height: 26px; display: grid; place-items: center;
  background: transparent; color: var(--sub, #6c716a); border: 1px solid var(--border-strong, var(--strong, #b9bdb3)); border-radius: 0; cursor: pointer;
  transition: color .2s, border-color .2s;
}
.avl .cerrar:hover { color: var(--text, #2c302c); border-color: var(--av); }
.avl .cerrar:focus-visible { outline: 2px solid var(--av); outline-offset: 2px; }
.avl .cerrar svg { width: 12px; height: 12px; }

/* barrita de tiempo: se achica hacia el centro */
.avl .tiempo {
  position: absolute; left: 0; right: 0; bottom: 2px; height: 2px;
  background: linear-gradient(to right, transparent, var(--av) 20%, var(--av) 80%, transparent);
  opacity: .7; transform-origin: center;
  animation: aviso-tiempo var(--dur, 4s) linear forwards;
}
.avl:hover .tiempo { animation-play-state: paused; }
@keyframes aviso-tiempo { to { transform: scaleX(0); } }

/* contenido aparece después de abrir */
.avl > :not(.tiempo) { animation: aviso-contenido .25s ease .18s both; }
@keyframes aviso-contenido { from { opacity: 0; } to { opacity: 1; } }

/* ===== abre / cierra ===== */
.avl        { animation: lateral-abre .32s cubic-bezier(.2,.7,.2,1) both; }
.avl.sale   { animation: lateral-cierra .26s ease-in both; }
@keyframes lateral-abre   { from { clip-path: inset(0 50% 0 50%); } to { clip-path: inset(0 0 0 0); } }
@keyframes lateral-cierra { from { clip-path: inset(0 0 0 0); opacity: 1; } to { clip-path: inset(0 50% 0 50%); opacity: .4; } }

@media (prefers-reduced-motion: reduce) {
  .avl, .avl > * { animation-duration: .01s !important; }
}

<script>
// ===== Aviso lateral · v1 =====
// uso: avisoLateral('Guardado', 'exito') · tipos: info / exito / alerta / error ('ok' = exito, sin tipo = lo deduce del texto)
// el texto va con textContent, no se ejecuta nada que venga escrito
(() => {
  const iconos = {
    info:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    exito:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    alerta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
    error:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'
  };
  const equis = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const MAX = 4;   // si hay más, se cierra el más viejo

  // ===== contenedor =====
  const caja = () => {
    let c = document.querySelector('.avls');
    if (!c) { c = document.createElement('div'); c.className = 'avls'; c.setAttribute('role', 'status'); c.setAttribute('aria-live', 'polite'); document.body.appendChild(c); }
    return c;
  };
  // ===== tipo según el texto, para los avisos que no lo traen =====
  const deducir = t => /^(listo|guardad|cierre guardado|prueba enviada|copiad)/i.test(t) ? 'exito' : /^(no se pudo|no se encontr|error|sin conexi)/i.test(t) ? 'error' : 'info';

  // ===== crear aviso =====
  window.avisoLateral = (texto, tipo, op = {}) => {
    texto = String(texto == null ? '' : texto);
    if (tipo === 'ok') tipo = 'exito';
    if (!iconos[tipo]) tipo = deducir(texto);
    const dur = op.dur || Math.min(12000, Math.max(tipo === 'error' ? 6000 : 4000, texto.length * 70));
    const caj = caja();
    const vivos = [...caj.querySelectorAll('.avl:not(.sale)')];
    if (vivos.some(v => v.dataset.k === tipo + '|' + texto)) return () => {};   // el mismo aviso ya está en pantalla
    if (vivos.length >= MAX) vivos[0].classList.add('sale');

    const el = document.createElement('div');
    el.className = 'avl ' + tipo;
    el.dataset.k = tipo + '|' + texto;
    el.style.setProperty('--dur', dur + 'ms');
    el.innerHTML = '<span class="relleno" aria-hidden="true"></span><span class="cont"><span class="icono" aria-hidden="true">' + iconos[tipo] + '</span><span class="texto"></span></span><button class="cerrar" type="button" aria-label="Cerrar">' + equis + '</button><span class="tiempo" aria-hidden="true"></span>';
    el.querySelector('.texto').textContent = texto;   // sin html

    const cerrar = () => {
      if (el.classList.contains('sale')) return;
      el.classList.add('sale');
      el.addEventListener('animationend', e => { if (e.target === el) el.remove(); });
    };
    el.addEventListener('animationend', e => { if (e.target === el && el.classList.contains('sale')) el.remove(); });
    el.querySelector('.cerrar').addEventListener('click', cerrar);
    el.querySelector('.tiempo').addEventListener('animationend', cerrar);
    caj.appendChild(el);
    return cerrar;
  };
})();
</script>

function confirmaRestaurar(r){
  const v = document.createElement('div'); v.className = 'vel';
  v.innerHTML = '<div class="ven" role="dialog" aria-modal="true"><h3 style="margin:0 0 6px;">Restaurar respaldo</h3><p class="nota" style="margin:0;">Los datos vuelven a como estaban el <b style="color:var(--text);">' + esc(fmtH(r.ts)) + '</b>, y lo que se hizo después se pierde. Antes de restaurar se guarda un respaldo de como están ahora.</p><div class="acc2"><button class="btn" id="rsNo" type="button">Cancelar</button><button class="btn bad" id="rsSi" type="button">Restaurar</button></div></div>';
  document.body.appendChild(v);
  const cerrar = () => v.remove();
  v.addEventListener('click', e => { if(e.target === v) cerrar(); });
  $('rsNo').addEventListener('click', cerrar);
  $('rsSi').addEventListener('click', async e => {
    e.currentTarget.disabled = true;
    const j = await accion('respaldoRestaurar', {n: r.n, confirmar: true}); cerrar();
    if(j){ toast('Datos restaurados.'); pintaRespaldos(await api('respaldosListar')); }
  });
}
// ===== Generador de documentos =====
// va en un marco aparte para que no se mezclen sus estilos con los del panel
// el marco crece con el contenido, así no lleva barra propia; el scroll es el de la página
function vistaGenerador(){
  main.innerHTML = '<iframe class="gen-fr" id="genFr" scrolling="no" title="Generador de documentos" src="generador_documentos.html?v=712"></iframe>';
  const f = $('genFr');
  f.addEventListener('load', () => {
    const d = f.contentDocument; if(!d) return;
    // las ventanas del generador se abren donde está mirando el usuario
    const st = d.createElement('style');
    st.textContent = 'html{overflow:hidden}.velo{align-items:flex-start !important}.velo .ven{margin-top:var(--vy,0px);max-height:var(--vh,90vh) !important;overflow:auto}';
    d.head.appendChild(st);
    const alto = () => { f.style.height = Math.ceil(d.body.getBoundingClientRect().height) + 'px'; };
    const pos = () => {
      if(!f.isConnected){ removeEventListener('scroll', pos); removeEventListener('resize', pos); return; }
      d.documentElement.style.setProperty('--vy', Math.max(0, -f.getBoundingClientRect().top) + 20 + 'px');
      d.documentElement.style.setProperty('--vh', Math.max(300, innerHeight - 40) + 'px');
    };
    alto(); pos();
    new ResizeObserver(alto).observe(d.body);
    addEventListener('scroll', pos, {passive:true}); addEventListener('resize', pos);
    f.classList.add('listo');
  });
}
async function ir(t){
  tab = t; document.querySelectorAll('#lado button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if(t === 'usuarios') vistaUsuarios(); else if(t === 'permisos') await vistaPermisos(); else if(t === 'encargados') vistaEncargados(); else if(t === 'visual') vistaVisual(); else if(t === 'rendimiento') await vistaRendimiento(); else if(t === 'rendimiento2') await vistaRendimiento2(); else if(t === 'generador') vistaGenerador(); else if(t === 'seguridad') await vistaSeguridad(); else vistaVentanas();
}
$('lado').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if(b) ir(b.dataset.t); });
function irMenuCarga(b){ if(b.classList.contains('btn-marcado')) return; b.classList.add('btn-marcado'); b.setAttribute('aria-pressed','true'); if(window.CargaPagina && window.CargaPagina.salir) window.CargaPagina.salir('index.html?menu=1','Volviendo al menú…',Promise.resolve()); else location.href='index.html?menu=1'; }
$('irMenu').addEventListener('click', e => irMenuCarga(e.currentTarget));
async function iniciar(){
  $('quien').textContent = DEMO ? 'Modo prueba · datos de ejemplo' : ((H && /^ismael\b/i.test(H.nombre || '') ? 'Dev' : 'Admin') + (H && H.nombre ? ' · ' + H.nombre : ''));
  if(window.CargaPagina && CargaPagina.espera) CargaPagina.espera('datos');
  const j = await api('adminUsuarios');
  if(!j || !j.ok){ main.innerHTML = '<div class="tarjeta">No se pudo cargar. Revisa la conexión y que el Apps Script esté publicado en la versión 64 o más nueva.</div>'; if(window.CargaPagina) await CargaPagina.fin(); return; }
  if(window.CargaPagina && CargaPagina.hecho) CargaPagina.hecho('datos');
  datos = {usuarios:j.usuarios, encargados:j.encargados, ajustes:j.ajustes || {halloween:false}};
  await ir('usuarios');
  if(window.CargaPagina) await CargaPagina.fin();
}
iniciar();
