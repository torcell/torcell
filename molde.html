<style>
/* ===== Colores ===== */
:root{--fondo:#eef1f5;--panel:#fff;--tinta:#1b2433;--suave:#5d6b80;--linea:#d5dbe4;--azul:#1f3b63;--azul2:#2d5590;--listo:#2f9e5b}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;border-radius:0}

/* ===== Marco del instalador ===== */
.inst{max-width:720px;margin:24px auto;background:var(--panel);box-shadow:0 2px 14px rgba(20,35,60,.1);display:grid;grid-template-columns:200px 1fr;min-height:480px}
.lado{background:var(--azul);color:#fff;padding:18px 0}
.lado h1{font-size:16px;margin:0 18px 14px;font-weight:600}
.paso{padding:8px 18px;font-size:14px;opacity:.6;border-left:3px solid transparent}
.paso.act{opacity:1;border-left-color:#fff;background:rgba(255,255,255,.08)}
.paso.ok{opacity:.9}
.paso.ok::after{content:" ✓"}
.der{display:flex;flex-direction:column;min-width:0}
.cont{padding:20px 22px;flex:1;transition:opacity .15s}
.cont h2{margin:0 0 4px;font-size:18px}
.cont p.ayuda{margin:0 0 16px;color:var(--suave);font-size:13px}
.pie{display:flex;justify-content:space-between;gap:6px;padding:12px 22px;border-top:1px solid var(--linea)}
.btn{height:36px;min-width:110px;padding:0 14px;border:1px solid var(--azul);background:#fff;color:var(--azul);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .08s}
.btn:hover{background:#e8eef7}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul2)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.chico{height:34px;min-width:0;padding:0 12px;font-size:13px}
.err{flex:1;align-self:center;text-align:center;color:#c0392b;font-size:13px}

/* ===== Campos ===== */
.campo{display:grid;gap:4px;margin-bottom:12px;font-size:13px;color:var(--suave)}
.campo input,.campo select{min-width:0;width:100%;height:34px;border:1px solid var(--linea);padding:0 8px;color:var(--tinta);background:#fff}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opc label{border:1px solid var(--linea);padding:12px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:border-color .15s}
.opc label:has(input:checked){border-color:var(--azul);background:#eef3fa}
.opc label.no{opacity:.45;cursor:default}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--suave);font-size:12px;padding:4px}
td{padding:4px;border-top:1px solid var(--linea)}
td input,td select{height:30px;width:100%;border:1px solid var(--linea);padding:0 6px}
td input[type=checkbox]{width:auto;height:auto}
td select{min-width:64px}
.nota{font-size:12px;color:var(--suave)}
.pil{display:inline-block;border-radius:999px;background:#eef3fa;padding:2px 10px;font-size:12px;margin:2px}
.res div{padding:6px 0;border-bottom:1px solid var(--linea)}
/* ===== Diferencias por piso ===== */
.difs.abre{animation:abreV .18s ease;transform-origin:top}
@keyframes abreV{from{opacity:0;transform:scaleY(.94)}to{opacity:1;transform:none}}
.dif{border:1px solid var(--linea);background:#f7f9fc;padding:10px;margin-bottom:8px;font-size:13px}
.dif .top{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px;align-items:center}
.dif .top > *{min-width:0}
.dif select,.dif input{height:34px;border:1px solid var(--linea);padding:0 8px;background:#fff;width:100%;color:var(--tinta)}
.dif .val{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--suave)}
.dif .val input[type=number]{width:90px}
.dif .val select{flex:1;min-width:140px;width:auto}
.dif .val .rot{flex-basis:100%}
.chip{width:40px;height:34px;border:1px solid var(--linea);background:#fff;color:var(--tinta);cursor:pointer;transition:background .15s,transform .08s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.temb{animation:temb .25s}
@keyframes temb{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* ===== Celular ===== */
@media (max-width:640px){
  .inst{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;margin:0;min-height:100vh}
  .lado{display:flex;overflow-x:auto;padding:10px 0;align-items:center}
  .lado h1{display:none}
  .paso{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:6px 12px}
  .paso.act{border-bottom-color:#fff}
  .dif .top{grid-template-columns:minmax(0,1fr) auto}
  .dif .top .tipo{grid-column:1/-1;order:3}
}
#cargaGlobal{position:fixed;inset:0;width:100vw;z-index:99990;background:linear-gradient(135deg,#0b2b36 0%,#13505f 55%,#2f6f8f 100%);}
.volver{max-width:720px;margin:16px auto -8px}
.volver .btn{text-decoration:none}
.btn-marcado{background:#2f6f8f !important;color:#fff !important;border-color:#2f6f8f !important;pointer-events:none}
.ver{max-width:720px;margin:8px auto 24px;text-align:right;font-size:12px;color:var(--suave)}
[hidden]{display:none !important}
/* ===== Relleno de prueba ===== */
.lado .ej{margin:14px 18px 0;min-width:0;width:calc(100% - 36px);background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.lado .ej:hover{background:rgba(255,255,255,.15)}
@media (max-width:640px){.lado .ej{flex:0 0 auto;width:auto;margin:0 12px}}
</style>
</head>

<div class="inst">
  <div class="lado" id="lado"><h1>Molde de secciones</h1></div>
  <div class="der">
    <div class="cont" id="cont"></div>
    <div class="pie">

<script>
// ===== Versión =====
const VER = '0.7.3';

// ===== Secciones =====
const SECC = {
  canteria:{nombre:'Cantería', partidas:[
    // en: d=dpto p=pasillo t=terraza
    {id:'vp', nombre:'Vanos puerta', unidad:'ml', en:'dpt'},
    {id:'vv', nombre:'Vanos ventana', unidad:'ml', en:'d'},
    {id:'ar', nombre:'Aristas y esquinas', unidad:'ml', en:'dpt'},
    {id:'mc', nombre:'Encuentro muro-cielo', unidad:'ml', en:'dp'},
    {id:'es', nombre:'Estuco', unidad:'m²', en:'dpt'}
  ]},
  ceramica:{nombre:'Cerámica y Frague', pronto:true},
  pintura:{nombre:'Pintura', pronto:true},
  puertas:{nombre:'Puertas', pronto:true}
};
const UNI = ['ml','m²','un','m³','gl'];
const PASOS = ['Sección','Obra','Instalaciones','Unidades','Equipo','Resumen'];

// ===== Estado =====
// parten en 0, se llenan en paso 4
function partidasTipo(k){
  return SECC[k].partidas.map(p => ({id:p.id, nombre:p.nombre, unidad:p.unidad, depto:0, pasillo:0, terraza:0,
    enD:p.en.includes('d'), enP:p.en.includes('p'), enT:p.en.includes('t'), activa:true}));
}
function leer(){ try{ return JSON.parse(localStorage.getItem('moldeConfigV3')); }catch(e){ return null; } }
let C = leer() || {
  seccion:'canteria', nombre:'Cantería',
  obra:{nombre:'Obra Bellavista, La Florida', tipo:'edificio', desde:0, hasta:0, saltados:[], subt:0, deptos:0, pasillo:false, terraza:false, techo:false, hayDif:false, dif:[]},
  partidas:partidasTipo('canteria'),
  equipo:{asistencia:true, trabajadores:true, finiquitos:true, anexos:true}
};
// completar lo guardado
C.obra.dif = (C.obra.dif || []).map(d => Object.assign({n:C.obra.deptos, deps:[], partida:'', txt:'', toc:true}, d));
C.partidas.forEach(p => { if(p.enD == null){ p.enD = p.depto > 0; p.enP = p.pasillo > 0; p.enT = p.terraza > 0; } if(p.activa == null) p.activa = true; });
if(C.obra.hayDif == null) C.obra.hayDif = C.obra.dif.length > 0;
let paso = 0;

// ===== Utiles =====
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const limpia = (s, m) => String(s == null ? '' : s).replace(/[<>"'`\\]/g,'').replace(/\s+/g,' ').trim().slice(0, m || 60);
const ent = (v, min, max) => { const n = parseInt(v, 10); return isFinite(n) ? Math.max(min, Math.min(max, n)) : min; };
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) && n >= 0 ? Math.round(n*100)/100 : 0; };
function campo(txt, inp){ const l = el('label','campo', txt); l.append(inp); return l; }
function input(tipo, val, fn, extra){ const i = el('input'); i.type = tipo; i.value = val; Object.assign(i, extra || {}); i.oninput = () => fn(i.value); if(tipo === 'number') i.onfocus = () => i.select(); return i; }
function check(txt, val, fn){ const l = el('label','chk'); const i = el('input'); i.type = 'checkbox'; i.checked = val; i.onchange = () => fn(i.checked); l.append(i, txt); return l; }
// ===== Diferencias por piso =====
const TIPOS = [['deptos','Cantidad de dptos'],['terraza','Terrazas'],['medida','Medida distinta'],['otra','Otra cosa']];
function pisosObra(){ const o = C.obra, l = []; for(let p = o.desde; p <= o.hasta; p++) if(!(o.saltados || []).includes(p)) l.push(p); return l; }
function nuevaDif(){ return {piso:pisosObra()[0] || 1, tipo:'deptos', n:C.obra.deptos, deps:[], partida:'', txt:'', toc:false}; }
function nDepsPiso(p){ const d = C.obra.dif.find(x => x.piso === p && x.tipo === 'deptos'); return d ? d.n : C.obra.deptos; }
const dd = d => String(d).padStart(2,'0');
function pintaDif(anim){
  const box = $('#difs'), o = C.obra; if(!box) return;
  box.textContent = ''; box.className = 'difs' + (anim ? ' abre' : '');
  if(!o.hayDif) return;
  if(!pisosObra().length){ box.append(el('p','nota','Primero pon desde qué piso y hasta qué piso.')); return; }
  o.dif.forEach((d, i) => {
    if(d.tipo === 'terraza' && !o.terraza) d.tipo = 'deptos';
    const f = el('div','dif'), top = el('div','top');
    const sp = el('select');
    pisosObra().forEach(p => { const op = el('option', null, 'Piso ' + p); op.value = p; sp.append(op); });
    sp.value = d.piso; sp.onchange = () => { d.piso = +sp.value; pintaDif(); };
    const st = el('select','tipo');
    TIPOS.filter(t => t[0] !== 'terraza' || o.terraza).forEach(([k, x]) => { const op = el('option', null, x); op.value = k; st.append(op); });
    st.value = d.tipo; st.onchange = () => { d.tipo = st.value; d.toc = false; pintaDif(); };
    const q = el('button','btn chico','Quitar'); q.onclick = () => { o.dif.splice(i, 1); pintaDif(); };
    top.append(sp, st, q); f.append(top);
    const v = el('div','val');
    if(d.tipo === 'deptos'){
      if(!d.toc) d.n = o.deptos;
      v.append('Dptos en este piso', input('number', d.n, x => { d.n = ent(x, 0, 20); d.toc = true; }, {min:0, max:20}), 'normal: ' + o.deptos);
    } else if(d.tipo === 'terraza'){
      const n = nDepsPiso(d.piso); d.deps = d.deps.filter(x => x <= n);
      v.append(el('span','rot','Toca los dptos que NO tienen terraza'));
      for(let k = 1; k <= n; k++){
        const c = el('button','chip' + (d.deps.includes(k) ? ' on' : ''), dd(k));
        c.onclick = () => { d.deps = d.deps.includes(k) ? d.deps.filter(x => x !== k) : d.deps.concat(k).sort((a, b) => a - b); c.classList.toggle('on'); };
        v.append(c);
      }
    } else if(d.tipo === 'medida'){
      const ps = C.partidas.filter(p => p.activa !== false);
      if(!ps.some(p => p.id === d.partida)) d.partida = ps[0] ? ps[0].id : '';
      const s2 = el('select'); ps.forEach(p => { const op = el('option', null, p.nombre); op.value = p.id; s2.append(op); });
      s2.value = d.partida;
      const pa = ps.find(x => x.id === d.partida);
      if(!d.toc) d.n = pa ? pa.depto : 0;
      s2.onchange = () => { d.partida = s2.value; d.toc = false; pintaDif(); };
      v.append(s2, input('number', d.n, x => { d.n = num(x); d.toc = true; }, {min:0, step:'0.5'}),
        el('span', null, pa ? pa.unidad + ' por dpto' + (pa.depto ? ' (normal ' + pa.depto + ')' : '') : ''));
    } else {
      const t = input('text', d.txt, x => d.txt = limpia(x, 80), {maxLength:80, placeholder:'Qué cambia (ej. sin vano de bodega)'});
      t.style.flex = '1'; v.append(t);
    }
    f.append(v); box.append(f);
  });
  const add = el('button','btn chico','Agregar otra diferencia');
  add.onclick = () => { o.dif.push(nuevaDif()); pintaDif(); };
  box.append(add);
}
function textoDif(d){
  const o = C.obra;
  if(d.tipo === 'deptos') return 'Piso ' + d.piso + ': ' + d.n + ' dptos';
  if(d.tipo === 'terraza') return 'Piso ' + d.piso + ': sin terraza ' + (d.deps.map(dd).join(', ') || '-');
  if(d.tipo === 'medida'){ const p = C.partidas.find(x => x.id === d.partida); return 'Piso ' + d.piso + ': ' + (p ? p.nombre + ' ' + d.n + ' ' + p.unidad : ''); }
  return 'Piso ' + d.piso + ': ' + d.txt;
}

function titulo(t, a){ const f = document.createDocumentFragment(); f.append(el('h2', null, t), el('p','ayuda', a)); return f; }

// ===== Pasos =====
const VISTAS = [
  // 1 sección
  b => {
    b.append(titulo('¿Qué sección vas a armar?', 'Según la sección cambian las preguntas siguientes.'));
    const o = el('div','opc');
    Object.keys(SECC).forEach(k => {
      const s = SECC[k], l = el('label', s.pronto ? 'no' : '');
      const r = el('input'); r.type = 'radio'; r.name = 'sec'; r.checked = C.seccion === k; r.disabled = !!s.pronto;
      r.onchange = () => { C.seccion = k; C.nombre = s.nombre; C.partidas = partidasTipo(k); };
      l.append(r, s.nombre + (s.pronto ? ' (pronto)' : ''));
      o.append(l);
    });
    b.append(o);
    const g = leer();
    if(g && g.partidas){
      const v = el('button','btn','Ver el panel ya creado'); v.style.marginTop = '14px';
      v.onclick = abrirPanel; b.append(v);
    }
  },
  // 2 obra
  b => {
    const o = C.obra; o.dif = o.dif || [];
    b.append(titulo('La obra', 'Pisos, subterráneos y departamentos por piso.'));
    b.append(campo('Nombre de la obra', input('text', o.nombre, v => o.nombre = limpia(v, 60), {maxLength:60})));
    const tp = el('select'); ['edificio','casas'].forEach(x => { const op = el('option', null, x === 'edificio' ? 'Edificio' : 'Casas'); op.value = x; tp.append(op); });
    tp.value = o.tipo; tp.onchange = () => { o.tipo = tp.value; pinta(); };
    b.append(campo('Tipo', tp));
    if(o.tipo === 'edificio'){
      const t = el('div','tres');
      t.append(campo('Desde piso', input('number', o.desde, v => { o.desde = ent(v, 0, 99); pintaDif(); })));
      t.append(campo('Hasta piso', input('number', o.hasta, v => { o.hasta = ent(v, 0, 99); pintaDif(); })));
      t.append(campo('Subterráneos', input('number', o.subt, v => o.subt = ent(v, 0, 9))));
      b.append(t);
      b.append(campo('Pisos que no lleva (separados por coma)', input('text', (o.saltados || []).join(', '), v => { o.saltados = v.split(',').map(x => parseInt(x, 10)).filter(isFinite); pintaDif(); }, {placeholder:'ej. 13'})));
      b.append(campo('Departamentos por piso', input('number', o.deptos, v => { o.deptos = ent(v, 0, 20); pintaDif(); })));
      b.append(check('Lleva pasillo / áreas comunes por piso', o.pasillo, v => o.pasillo = v));
      b.append(check('Lleva azotea', !!o.techo, v => o.techo = v));
      b.append(check('Los dptos llevan terraza', !!o.terraza, v => { o.terraza = v; pintaDif(); }));
      b.append(check('Hay pisos diferentes (menos dptos, menos terrazas, otra medida...)', !!o.hayDif, v => {
        o.hayDif = v; if(v && !o.dif.length) o.dif.push(nuevaDif()); pintaDif(v);
      }));
      const box = el('div','difs'); box.id = 'difs'; b.append(box); pintaDif();
    } else {
      b.append(campo('Cantidad de casas', input('number', o.deptos, v => o.deptos = ent(v, 0, 200))));
      b.append(el('p','nota','Las casas se muestran como una sola fila por ahora.'));
    }
  },
  // 3 instalaciones
  b => {
    b.append(titulo('¿Dónde va cada partida?', 'Marca las partidas de ' + C.nombre + ' y si van en depto, pasillo o ambos.'));
    const ter = !!C.obra.terraza;
    const t = el('table'); const h = el('tr'); ['','Partida','Depto','Pasillo'].concat(ter ? ['Terraza'] : []).forEach(x => h.append(el('th', null, x))); t.append(h);
    C.partidas.forEach(p => {
      const r = el('tr');
      const c0 = el('td'); const a = el('input'); a.type = 'checkbox'; a.checked = p.activa !== false; a.onchange = () => p.activa = a.checked; c0.append(a);
      const c1 = el('td'); c1.append(input('text', p.nombre, v => p.nombre = limpia(v, 40), {maxLength:40}));
      const c2 = el('td'); const d = el('input'); d.type = 'checkbox'; d.checked = p.enD; d.onchange = () => p.enD = d.checked; c2.append(d);
      const c3 = el('td'); const q = el('input'); q.type = 'checkbox'; q.checked = p.enP; q.onchange = () => p.enP = q.checked; c3.append(q);
      r.append(c0, c1, c2, c3);
      if(ter){ const c4 = el('td'); const z = el('input'); z.type = 'checkbox'; z.checked = p.enT; z.onchange = () => p.enT = z.checked; c4.append(z); r.append(c4); }
      t.append(r);
    });
    b.append(t);
    const add = el('button','btn','Agregar partida'); add.style.marginTop = '10px';
    add.onclick = () => { C.partidas.push({id:'p' + Date.now().toString(36), nombre:'Nueva partida', unidad:'ml', depto:0, pasillo:0, terraza:0, enD:true, enP:false, enT:false, activa:true}); pinta(); };
    b.append(add);
  },
  // 4 unidades
  b => {

    const t = el('table'); const h = el('tr'); ['Partida','Unidad','Por depto','Por pasillo'].concat(ter ? ['Por terraza'] : []).forEach(x => h.append(el('th', null, x))); t.append(h);
    C.partidas.filter(p => p.activa !== false).forEach(p => {
      const r = el('tr'); r.append(el('td', null, p.nombre));

      const c1 = el('td'); c1.append(s);

      const c3 = el('td'); c3.append(input('number', p.pasillo, v => p.pasillo = num(v), {disabled:!p.enP || !(C.obra.pasillo || C.obra.techo), step:'0.5', min:0}));
      r.append(c1, c2, c3);

];

// ===== Validar =====
function valida(){
  const o = C.obra;
  if(paso === 1){
    if(!o.nombre) return 'Falta el nombre de la obra';
    if(o.tipo === 'casas' && o.deptos < 1) return 'Falta la cantidad de casas';
    if(o.tipo === 'edificio' && o.desde < 1) return 'Falta desde qué piso';
    if(o.tipo === 'edificio' && o.hasta < o.desde) return 'El piso final es menor que el inicial';
    if(o.tipo === 'edificio' && o.deptos < 1) return 'Faltan los dptos por piso';
    if(o.tipo === 'edificio' && o.hayDif){
      const ps = pisosObra(), vistos = {};
      for(const d of o.dif){
        if(!ps.includes(d.piso)) return 'El piso ' + d.piso + ' no está en la obra';
        if(d.tipo === 'otra' && !d.txt) return 'Piso ' + d.piso + ': escribe qué cambia';
        if(d.tipo === 'medida' && !d.partida) return 'Piso ' + d.piso + ': elige la partida';
        if(d.tipo === 'deptos' && d.n < 1) return 'Piso ' + d.piso + ': pon cuántos dptos tiene';
        const k = d.piso + d.tipo + (d.tipo === 'medida' ? d.partida : d.tipo === 'otra' ? d.txt : '');
        if(vistos[k]) return 'Piso ' + d.piso + ' tiene la misma diferencia repetida';
        vistos[k] = 1;
      }
    }
  }
  if(paso === 2 && !C.partidas.some(p => p.activa !== false)) return 'Marca al menos una partida';
  if(paso === 3){
    const o = C.obra, pas = o.pasillo || o.techo;
    for(const p of C.partidas.filter(x => x.activa !== false)){
      if(p.enD && !(p.depto > 0)) return p.nombre + ': falta la cantidad por depto';
      if(p.enP && pas && !(p.pasillo > 0)) return p.nombre + ': falta la cantidad por pasillo';
      if(p.enT && o.terraza && !(p.terraza > 0)) return p.nombre + ': falta la cantidad por terraza';
    }
  }
  return '';
}

// ===== Pintar =====
function pinta(){
  const l = $('#lado'); l.querySelectorAll('.paso').forEach(x => x.remove());
  PASOS.forEach((p, i) => l.append(el('div','paso' + (i === paso ? ' act' : i < paso ? ' ok' : ''), (i + 1) + '. ' + p)));
  const ej = l.querySelector('.ej'); if(ej) l.append(ej); // el botón de prueba va al final
  // cel: mover al paso actual
  const ac = l.querySelector('.act'); if(ac && l.scrollWidth > l.clientWidth) l.scrollTo({left:ac.offsetLeft - 12, behavior:'smooth'});
  const c = $('#cont'); c.style.opacity = 0;
  setTimeout(() => { c.textContent = ''; VISTAS[paso](c); c.style.opacity = 1; }, 120);
  $('#err').textContent = '';
  $('#atras').disabled = paso === 0;
  $('#sig').textContent = paso === PASOS.length - 1 ? 'Guardar' : 'Siguiente';
}
$('#atras').onclick = () => { if(paso > 0){ paso--; pinta(); } };
$('#sig').onclick = () => {
  const er = valida();
  $('#err').textContent = er;
  if(er){ const b = $('#sig'); b.classList.add('temb'); setTimeout(() => b.classList.remove('temb'), 260); return; }
  if(paso < PASOS.length - 1){ paso++; pinta(); return; }
  const out = JSON.parse(JSON.stringify(C));
  const ob = out.obra;
  if(ob.tipo !== 'edificio') ob.techo = false;
  out.partidas = out.partidas.filter(p => p.activa !== false).map(p => ({id:p.id, nombre:p.nombre, unidad:p.unidad, depto:p.enD ? p.depto : 0, pasillo:p.enP && (ob.pasillo || ob.techo) ? p.pasillo : 0, terraza:p.enT && ob.terraza ? p.terraza : 0}));
  // limpiar difs
  ob.dif = ob.tipo === 'edificio' && ob.hayDif ? ob.dif.filter(d => d.tipo !== 'terraza' || ob.terraza).map(d =>
    d.tipo === 'deptos' ? {piso:d.piso, tipo:'deptos', n:d.n} :
    d.tipo === 'terraza' ? {piso:d.piso, tipo:'terraza', deps:d.deps} :
    d.tipo === 'medida' ? {piso:d.piso, tipo:'medida', partida:d.partida, n:d.n} :
    {piso:d.piso, tipo:'otra', txt:d.txt}) : [];
  out.version = VER; out.guardado = new Date().toISOString();
  try{ localStorage.setItem('moldeConfigV3', JSON.stringify(out)); }catch(e){}
  abrirPanel();
};
// ===== Relleno de prueba =====
function rellenar(){
  C.seccion = 'canteria'; C.nombre = 'Cantería'; C.partidas = partidasTipo('canteria');
  const q = {vp:[5, 3, 2], vv:[8, 0, 0], ar:[12, 6, 6], mc:[24, 18, 0], es:[45, 30, 12]};
  C.partidas.forEach(p => { const v = q[p.id] || [1, 1, 1]; p.depto = p.enD ? v[0] : 0; p.pasillo = p.enP ? v[1] : 0; p.terraza = p.enT ? v[2] : 0; });
  Object.assign(C.obra, {nombre:'Obra Bellavista, La Florida', tipo:'edificio', desde:1, hasta:20, saltados:[], subt:2, deptos:6, pasillo:true, techo:true, terraza:true, hayDif:true,
    dif:[
      {piso:3, tipo:'terraza', deps:[1, 2]},
      {piso:10, tipo:'medida', partida:'es', n:52, toc:true},
      {piso:15, tipo:'otra', txt:'sin vano de bodega'},
      {piso:20, tipo:'deptos', n:4, toc:true}
    ].map(d => Object.assign({n:6, deps:[], partida:'', txt:'', toc:false}, d))});
  C.equipo = {asistencia:true, trabajadores:true, finiquitos:true, anexos:true};
  pinta();
}

er}\n\n/* ===== Lista por piso ===== */\n.lp{border-bottom:1px solid var(--linea);padding:8px 0;display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}\n.lp .piso{min-height:40px}\n.barras{display:grid;gap:3px}\n.barras .nota{margin-top:2px;color:#9a6512}\n.br{display:grid;grid-template-columns:150px 1fr 80px;gap:8px;align-items:center;font-size:12px}\n.br .t{height:8px;background:var(--cero);position:relative}\n.br .t i{position:absolute;left:0;top:0;bottom:0;background:var(--medio)}\n.br .t i.ok{background:var(--listo)}\n.br em{font-style:normal;text-align:right;color:var(--suave);white-space:nowrap}\n\n/* ===== Ventanas ===== */\n.velo{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto;opacity:0;transition:opacity .18s}\n.velo.ver{display:flex}\n.velo.ver.on{opacity:1}\n.ven{background:var(--panel);width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.25);transform-origin:top center;transform:scaleY(.94);transition:transform .18s ease}\n.velo.on .ven{transform:scaleY(1)}\n.ven h2{margin:0;font-size:16px;padding:12px 16px;background:var(--azul);color:#fff}\n.ven .cuerpo{padding:14px 16px;max-height:65vh;overflow:auto}\n.ven .pie{display:flex;gap:6px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--linea)}\n.ven .pie .btn{min-width:120px}\n.par{display:grid;grid-template-columns:1fr 92px 58px 58px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea)}\n.par label{font-size:14px}\n.par label small{display:block;color:var(--suave);font-size:12px}\n.par input{height:30px;width:100%;border:1px solid var(--linea);padding:0 6px;text-align:right}\n.campo{display:grid;gap:4px;margin-bottom:10px;font-size:13px;color:var(--suave)}\n.campo input,.campo select{height:34px;border:1px solid var(--linea);padding:0 8px;color:var(--tinta);background:#fff}\n.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.trab{border:1px solid var(--linea);padding:10px;margin-bottom:8px}\n.trab.baja{opacity:.6}\n.trab .top{display:flex;justify-content:space-between;gap:8px;align-items:center}\n.trab .acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}\n.est{border-radius:999px;font-size:11px;padding:2px 8px;background:var(--cero)}\n.est.ok{background:#d8f0e1;color:#1d6b3d}\n.est.no{background:#f6d9d5;color:#8e2a1f}\n.asi{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea)}\n.asi .bs{display:flex;gap:0}\n.asi .bs .btn{min-width:74px}\n.asi .hora{grid-column:1/-1;display:none;gap:6px;align-items:center;font-size:13px}\n.asi .hora.ver{display:flex}\n.asi .hora input{height:30px;border:1px solid var(--linea)}\n.his{font-size:13px;padding:6px 0;border-bottom:1px solid var(--linea)}\n.his time{color:var(--suave);font-size:12px;display:block}\n.nota{font-size:12px;color:var(--suave);margin-top:6px}\n.temb{animation:temb .25s}\n@keyframes temb{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}\n\n/* ===== Celular ===== */\n@media (max-width:560px){\n  .caja{margin:0 0 12px;padding:8px}\n  .res,.filtros,.herr{padding-left:10px;padding-right:10px}\n  .filtros{flex-wrap:wrap}\n  #fPart{flex-basis:100%;order:2}\n  .vistas{order:1;width:100%}\n  .vistas .btn{flex:1}\n  .celda .p{font-size:10px}\n  .br{grid-template-columns:1fr auto;row-gap:2px}\n  .br .t{grid-column:1/-1;order:3}\n  .par{grid-template-columns:1fr 76px 50px 50px}\n}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"carga\">\n  <div class=\"ln\" id=\"l1\"><\/div>\n  <div class=\"txt\"><b>Cargando panel de Cantería<\/b><span id=\"cargaEst\">Leyendo datos...<\/span><\/div>\n  <div class=\"ln\" id=\"l2\"><\/div>\n  <div class=\"barra\"><i id=\"cargaBar\"><\/i><\/div>\n<\/div>\n\n<div id=\"app\">\n<header>\n  <h1>Panel de Cantería<\/h1>\n  <small id=\"subt\">Obra Bellavista, La Florida - prueba sin login<\/small>\n<\/header>\n\n<div class=\"herr\">\n  <button class=\"btn\" data-abre=\"vAsis\">Asistencia<\/button>\n  <button class=\"btn\" data-abre=\"vTrab\">Trabajadores<\/button>\n  <button class=\"btn\" data-abre=\"vHis\">Historial<\/button>\n  <button class=\"btn\" id=\"bEditar\" style=\"margin-left:auto\">Editar molde<\/button>\n  <a class=\"btn\" target=\"_top\" href=\"index.html?menu=1\" style=\"text-decoration:none\">Cambiar de sección<\/a>\n<\/div>\n\n<div class=\"res\" id=\"res\"><\/div>\n\n<div class=\"filtros\">\n  <div id=\"fPart\"><\/div>\n  <div class=\"vistas\">\n    <button class=\"btn chico on\" id=\"vFach\">Fachada<\/button>\n    <button class=\"btn chico\" id=\"vLista\">Por piso<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"caja\" id=\"tablero\"><\/div>\n<\/div>\n\n<!-- ===== Ventana depto ===== -->\n<div class=\"velo\" id=\"vDep\"><div class=\"ven\">\n  <h2 id=\"depTit\">Dpto<\/h2>\n  <div class=\"cuerpo\">\n    <div class=\"campo\">Contratista a cargo\n      <select id=\"depCon\"><\/select>\n    <\/div>\n    <div id=\"depPar\"><\/div>\n    <div class=\"nota\">Ingresa lo hecho en la unidad de cada partida. «Todo» la deja completa.<\/div>\n  <\/div>\n  <div class=\"pie\">\n    <button class=\"btn\" data-cierra>Cancelar<\/button>\n    <button class=\"btn pri\" id=\"depOk\">Guardar y cerrar<\/button>\n  <\/div>\n<\/div><\/div>\n\n<!-- ===== Ventana piso ===== -->\n<div class=\"velo\" id=\"vPiso\"><div class=\"ven\">\n  <h2 id=\"pisoTit\">Piso<\/h2>\n  <div class=\"cuerpo\" id=\"pisoDif\"><\/div>\n  <div class=\"pie\"><button class=\"btn pri\" data-cierra>Cerrar<\/button><\/div>\n<\/div><\/div>\n\n<!-- ===== Ventana asistencia ===== -->\n<div class=\"velo\" id=\"vAsis\"><div class=\"ven\">\n  <h2>Asistencia<\/h2>\n  <div class=\"cuerpo\">\n    <div class=\"campo\">Día\n      <input type=\"date\" id=\"asiDia\">\n    <\/div>\n    <div id=\"asiLista\"><\/div>\n    <div class=\"nota\">Cada marca se guarda al tocarla.<\/div>\n  <\/div>\n  <div class=\"pie\"><button class=\"btn pri\" data-cierra>Cerrar<\/button><\/div>\n<\/div><\/div>\n\n<!-- ===== Ventana trabajadores ===== -->\n<div class=\"velo\" id=\"vTrab\"><div class=\"ven\">\n  <h2>Trabajadores<\/h2>\n  <div class=\"cuerpo\">\n    <div class=\"dos\">\n      <div class=\"campo\">Nombre<input id=\"tNom\" maxlength=\"60\"><\/div>\n      <div class=\"campo\">RUT<input id=\"tRut\" maxlength=\"12\" placeholder=\"12.345.678-9\"><\/div>\n    <\/div>\n    <div class=\"dos\">\n      <div class=\"campo\">Cargo\n        <select id=\"tCar\"><option>Maestro canterista<\/option><option>Ayudante<\/option><option>Jornal<\/option><\/select>\n      <\/div>\n      <div class=\"campo\">Ingreso<input type=\"datetime-local\" id=\"tIng\"><\/div>\n    <\/div>\n    <button class=\"btn\" id=\"tAdd\" style=\"width:100%;margin-bottom:12px\">Agregar trabajador<\/button>\n    <div id=\"tLista\"><\/div>\n  <\/div>\n  <div class=\"pie\">\n    <button class=\"btn\" data-cierra>Cancelar<\/button>\n    <button class=\"btn pri\" id=\"tOk\">Guardar y cerrar<\/button>\n  <\/div>\n<\/div><\/div>\n\n<!-- ===== Ventana historial ===== -->\n<div class=\"velo\" id=\"vHis\"><div class=\"ven\">\n  <h2>Historial<\/h2>\n  <div class=\"cuerpo\" id=\"hLista\"><\/div>\n  <div class=\"pie\"><button class=\"btn pri\" data-cierra>Cerrar<\/button><\/div>\n<\/div><\/div>\n\n<script>\n// ===== Versión =====\nconst VER = '0.5.2';\n\n// ===== Config base =====\nconst BASE = {\n  seccion:'canteria', nombre:'Cantería',\n  obra:{nombre:'Obra Bellavista, La Florida', tipo:'edificio', desde:2, hasta:22, saltados:[], subt:2, deptos:8, pasillo:true, terraza:true, techo:true,\n    dif:[{piso:2, tipo:'deptos', n:6}, {piso:3, tipo:'terraza', deps:[1,8]}]},\n  partidas:[\n    {id:'vp', nombre:'Vanos puerta', unidad:'ml', depto:14, pasillo:6, terraza:5},\n    {id:'vv', nombre:'Vanos ventana', unidad:'ml', depto:18, pasillo:0, terraza:0},\n    {id:'ar', nombre:'Aristas y esquinas', unidad:'ml', depto:22, pasillo:12, terraza:3},\n    {id:'mc', nombre:'Encuentro muro-cielo', unidad:'ml', depto:38, pasillo:30, terraza:0},\n    {id:'es', nombre:'Estuco', unidad:'m²', depto:12, pasillo:20, terraza:4}\n  ],\n  equipo:{asistencia:true, trabajadores:true, finiquitos:true, anexos:true}\n};\n\n// ===== Guardado local =====\nconst K = 'canteriaPruebaV1';\nfunction leer(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }\nfunction guardar(){ try{ localStorage.setItem(K, JSON.stringify(D)); }catch(e){} }\n\nlet cfg = leer('moldeConfigV3', null);\nif(!cfg || cfg.seccion !== 'canteria') cfg = BASE;\nlet D = leer(K, null) || {avance:{}, asignado:{}, trab:[], asis:{}, his:[]};\n\n// ===== Utiles =====\nconst $ = s => document.querySelector(s);\nconst el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };\n// limpiar texto\nconst limpia = (s, max) => String(s == null ? '' : s).replace(/[<>\"'`\\\\]/g,'').replace(/\\s+/g,' ').trim().slice(0, max || 80);\nconst num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) && n >= 0 ? Math.round(n*100)/100 : 0; };\nconst ahora = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };\nconst fmtFecha = s => s ? s.replace('T',' ') : '';\nconst fmt = n => (Math.round(n*10)/10).toLocaleString('es-CL');\nfunction anota(txt){ D.his.unshift({t:ahora(), txt:limpia(txt, 160)}); if(D.his.length > 500) D.his.length = 500; }\n\n// ===== Pisos =====\nfunction pisos(){\n  const o = cfg.obra, l = [];\n  if(o.techo) l.push({n:TECHO, sub:true, techo:true});\n  for(let p = o.hasta; p >= o.desde; p--) if(!(o.saltados || []).includes(p)) l.push({n:p, sub:false});\n  for(let s = 1; s <= (o.subt || 0); s++) l.push({n:-s, sub:true});\n  return l;\n}\nconst TECHO = 100;\nconst etiqueta = n => n === TECHO ? 'Azotea' : n < 0 ? 'S' + (-n) : String(n);\n// col pasillo / azotea\nconst hayCol = () => cfg.obra.pasillo || !!cfg.obra.techo;\nconst codDep = (p, d) => d === 0 ? (p === TECHO ? 'Área común' : 'Pasillo') : etiqueta(p) + String(d).padStart(2,'0');\n\n// ===== Diferencias por piso =====\nconst difs = () => cfg.obra.dif || [];\nconst difDe = (p, t) => difs().filter(x => x.piso === p && x.tipo === t);\nfunction nDeps(p){ const d = difDe(p, 'deptos')[0]; return d ? d.n : cfg.obra.deptos; }\nfunction conTerraza(p, d){\n  if(!cfg.obra.terraza || d === 0) return false;\n  const x = difDe(p, 'terraza')[0]; return !(x && x.deps.includes(d));\n}\nfunction depsDe(pi){ if(pi.techo) return [0]; const l = []; if(!pi.sub) for(let d = 1; d <= nDeps(pi.n); d++) l.push(d); if(cfg.obra.pasillo) l.push(0); return l; }\nconst maxDeps = () => Math.max(cfg.obra.deptos, ...difs().filter(x => x.tipo === 'deptos').map(x => x.n));\nconst dd = d => String(d).padStart(2,'0');\nfunction textoDifs(p){\n  return difs().filter(x => x.piso === p).map(x => {\n    if(x.tipo === 'deptos') return x.n + ' dptos (normal ' + cfg.obra.deptos + ')';\n    if(x.tipo === 'terraza') return 'Sin terraza: ' + (x.deps.length ? x.deps.map(dd).join(', ') : '-');\n    if(x.tipo === 'medida'){ const pa = cfg.partidas.find(y => y.id === x.partida); return pa ? pa.nombre + ': ' + fmt(x.n) + ' ' + pa.unidad + ' por dpto (normal ' + fmt(pa.depto) + ')' : ''; }\n    return x.txt;\n  }).filter(Boolean);\n}\n\n// ===== Cálculo =====\nlet filtro = 'todas';\nfunction totalDe(x, p, d){\n  if(d === 0) return x.pasillo || 0;\n  const m = difs().find(y => y.piso === p && y.tipo === 'medida' && y.partida === x.id);\n  let t = m ? m.n : (x.depto || 0);\n  if(conTerraza(p, d)) t += x.terraza || 0;\n  return t;\n}\nfunction partidasDe(p, d){ return cfg.partidas.filter(x => totalDe(x, p, d) > 0); }\nfunction avanceDep(p, d){\n  const a = D.avance[p + '-' + d] || {};\n  let hecho = 0, total = 0;\n  partidasDe(p, d).forEach(x => {\n    if(filtro !== 'todas' && filtro !== x.id) return;\n    // % promedio de partidas\n    total += 1; hecho += Math.min(1, (a[x.id] || 0) / totalDe(x, p, d));\n  });\n  return total ? hecho / total : null;\n}\nfunction cantidades(){\n  // total por unidad\n  const r = {};\n  pisos().forEach(p => depsDe(p).forEach(d => partidasDe(p.n, d).forEach(x => {\n    if(filtro !== 'todas' && filtro !== x.id) return;\n    const u = x.unidad, t = totalDe(x, p.n, d); r[u] = r[u] || {h:0, t:0};\n    r[u].t += t;\n    r[u].h += Math.min(t, (D.avance[p.n + '-' + d] || {})[x.id] || 0);\n  })));\n  return r;\n}\nconst clase = v => v == null ? '' : v >= 0.999 ? 'listo' : v > 0.66 ? 'a3' : v > 0.33 ? 'a2' : v > 0 ? 'a1' : '';\n\n// ===== Resumen =====\nfunction pintaRes(){\n  const r = $('#res'); r.textContent = '';\n  const c = cantidades();\n  Object.keys(c).forEach(u => {\n    const p = el('span','pil'); const b = el('b', null, fmt(c[u].h) + ' / ' + fmt(c[u].t) + ' ' + u);\n    p.append(b, ' (' + (c[u].t ? Math.round(c[u].h / c[u].t * 100) : 0) + '%)');\n    r.append(p);\n  });\n  const act = D.trab.filter(t => !t.baja).length;\n  r.append(el('span','pil', act + ' trabajadores activos'));\n}\n\n// ===== Filtros de partida =====\nfunction pintaFiltros(){\n  const f = $('#fPart'); f.textContent = '';\n  [{id:'todas', nombre:'Todas'}].concat(cfg.partidas).forEach(x => {\n    const b = el('button','btn chico' + (filtro === x.id ? ' on' : ''), x.nombre);\n    b.onclick = () => { filtro = x.id; pintaTodo(); };\n    f.append(b);\n  });\n}\n\n// ===== Vista fachada =====\nlet vista = 'fachada';\nfunction bloquePiso(p, txt){\n  const dif = textoDifs(p.n);\n  const pz = el(dif.length ? 'button' : 'div', 'piso' + (dif.length ? ' dif' : '') + (p.techo ? ' techo' : ''));\n  pz.append(el('span','nom', etiqueta(p.n))); if(p.techo) pz.title = etiqueta(p.n);\n  pz.append(el('small', null, txt));\n  if(dif.length){ pz.title = dif.join(', '); pz.onclick = () => abrePiso(p.n); }\n  return pz;\n}\nfunction pctPiso(p){\n  let s = 0, c = 0;\n  depsDe(p).forEach(d => { const v = avanceDep(p.n, d); if(v != null){ s += v; c++; } });\n  return c ? Math.round(s / c * 100) + '%' : '-';\n}\nfunction pintaFachada(){\n  const t = $('#tablero'); t.textContent = '';\n  const nd = maxDeps(), pas = hayCol();\n  const pc = matchMedia('(min-width:561px)').matches; // en pc los dptos van cuadrados\n  t.classList.toggle('cuad', pc);\n  const cols = pc ? '60px repeat(' + nd + ',60px)' + (pas ? ' 60px' : '') : '54px repeat(' + nd + ',minmax(0,1fr))' + (pas ? ' minmax(0,1fr)' : '');\n  const cab = el('div','cabcol'); cab.style.gridTemplateColumns = cols;\n  cab.append(el('span', null, 'Piso'));\n  for(let d = 1; d <= nd; d++) cab.append(el('span', null, dd(d)));\n  if(pas) cab.append(el('span', null, cfg.obra.pasillo ? 'Pas.' : 'Á. común'));\n  t.append(cab);\n  pisos().forEach(p => {\n    const f = el('div','fila'); f.style.gridTemplateColumns = cols;\n    f.append(bloquePiso(p, pctPiso(p)));\n    const n = nDeps(p.n);\n    for(let d = 1; d <= nd; d++){\n      if(p.sub){ f.append(el('div','celda vacia')); continue; }\n      if(d > n){ const x = el('div','celda nada'); x.title = 'Piso ' + etiqueta(p.n) + ': no existe dpto ' + dd(d); f.append(x); continue; }\n      f.append(celda(p.n, d));\n    }\n    if(pas) f.append(p.techo || cfg.obra.pasillo ? celda(p.n, 0) : el('div','celda vacia'));\n    t.append(f);\n  });\n  const ley = el('div','ley');\n  const item = (cls, bg, x) => { const s = el('span'); const i = el('i', cls); if(bg) i.style.background = bg; s.append(i, x); ley.append(s); };\n  [['var(--cero)','0%'],['#fdf3e1','1-33%'],['#f9dfae','34-66%'],['#f3c574','67-99%'],['#d8f0e1','Terminado']].forEach(([c, x]) => item('', c, x));\n  item('', 'repeating-linear-gradient(135deg,#e3e7ee 0 3px,#cfd5df 3px 6px)', cfg.obra.techo ? 'Pasillo / área común' : 'Pasillo');\n  if(cfg.obra.terraza) item('st', '', 'Sin terraza');\n  if(difs().some(x => x.tipo === 'deptos')) item('nada', '', 'No existe');\n  if(difs().length) item('dif', '', 'Piso con diferencias (tócalo)');\n  t.append(ley);\n}\nfunction celda(p, d){\n  const v = avanceDep(p, d);\n  const b = el('button','celda ' + clase(v) + (d === 0 ? ' pas' : '') + (d > 0 && cfg.obra.terraza && !conTerraza(p, d) ? ' st' : ''));\n  if(v == null){ b.classList.add('vacia'); return b; }\n  b.append(el('span','n', d === 0 ? (p === TECHO ? 'AC' : 'P') : dd(d)), el('span','p', Math.round(v * 100) + '%'));\n  const f = el('span','f'); f.style.width = (v * 100) + '%'; b.append(f);\n  b.title = 'Piso ' + etiqueta(p) + ' - ' + codDep(p, d);\n  b.onclick = () => abreDep(p, d);\n  return b;\n}\nfunction abrePiso(p){\n  $('#pisoTit').textContent = 'Piso ' + etiqueta(p) + ' - diferencias';\n  const box = $('#pisoDif'); box.textContent = '';\n  textoDifs(p).forEach(x => box.append(el('div','his', x)));\n  abre('vPiso');\n}\n\n// ===== Vista por piso =====\nfunction pintaLista(){\n  const t = $('#tablero'); t.textContent = '';\n  pisos().forEach(p => {\n    const fila = el('div','lp');\n    const ds = depsDe(p);\n    if(!ds.length) return;\n    const bs = el('div','barras');\n    let sp = 0, cp = 0;\n    cfg.partidas.forEach(x => {\n      if(filtro !== 'todas' && filtro !== x.id) return;\n      let h = 0, tt = 0;\n      ds.forEach(d => { const q = totalDe(x, p.n, d); if(q > 0){ tt += q; h += Math.min(q, (D.avance[p.n + '-' + d] || {})[x.id] || 0); } });\n      if(!tt) return;\n      const v = h / tt; sp += v; cp++;\n      const r = el('div','br');\n      const tr = el('div','t'); const i = el('i', v >= 0.999 ? 'ok' : ''); i.style.width = (v * 100) + '%'; tr.append(i);\n      r.append(el('span', null, x.nombre), tr, el('em', null, fmt(h) + '/' + fmt(tt) + ' ' + x.unidad));\n      bs.append(r);\n    });\n    const dif = textoDifs(p.n);\n    if(dif.length) bs.append(el('div','nota', dif.join(', ')));\n    fila.append(bloquePiso(p, cp ? Math.round(sp / cp * 100) + '%' : '-'), bs);\n    t.append(fila);\n  });\n}\n\nmatchMedia('(min-width:561px)').addEventListener('change', () => pintaTodo());\nfunction pintaTodo(){ pintaRes(); pintaFiltros(); vista === 'fachada' ? pintaFachada() : pintaLista(); }\n\n$('#vFach').onclick = () => { vista = 'fachada'; $('#vFach').classList.add('on'); $('#vLista').classList.remove('on'); pintaTodo(); };\n$('#vLista').onclick = () => { vista = 'lista'; $('#vLista').classList.add('on'); $('#vFach').classList.remove('on'); pintaTodo(); };\n\n// ===== Ventanas =====\nfunction abre(id){\n  const v = document.getElementById(id);\n  v.classList.add('ver'); requestAnimationFrame(() => requestAnimationFrame(() => v.classList.add('on')));\n}\nfunction cierra(v){\n  v.classList.remove('on'); setTimeout(() => v.classList.remove('ver'), 180);\n}\ndocument.querySelectorAll('[data-cierra]').forEach(b => b.onclick = () => cierra(b.closest('.velo')));\ndocument.querySelectorAll('[data-abre]').forEach(b => b.onclick = () => {\n  const id = b.dataset.abre;\n  if(id === 'vAsis') pintaAsis();\n  if(id === 'vTrab'){ tTemp = JSON.parse(JSON.stringify(D.trab)); pintaTrab(); $('#tIng').value = ahora(); }\n  if(id === 'vHis') pintaHis();\n  abre(id);\n});\n\n// ===== Depto =====\nlet depAct = null;\nfunction abreDep(p, d){\n  depAct = {p, d};\n  $('#depTit').textContent = p === TECHO ? etiqueta(p) + ' - Área común' : d === 0 ? 'Piso ' + etiqueta(p) + ' - Pasillo' : 'Piso ' + etiqueta(p) + ' - Dpto ' + codDep(p, d);\n  const sel = $('#depCon'); sel.textContent = '';\n  sel.append(el('option', null, 'Sin asignar')); sel.options[0].value = '';\n  D.trab.filter(t => !t.baja).forEach(t => { const o = el('option', null, t.nombre); o.value = t.id; sel.append(o); });\n  sel.value = D.asignado[p + '-' + d] || '';\n  const box = $('#depPar'); box.textContent = '';\n  const a = D.avance[p + '-' + d] || {};\n  if(d > 0 && cfg.obra.terraza) box.append(el('span','est ' + (conTerraza(p, d) ? 'ok' : ''), conTerraza(p, d) ? 'Con terraza' : 'Sin terraza'));\n  partidasDe(p, d).forEach(x => {\n    const tot = totalDe(x, p, d);\n    const r = el('div','par');\n    const lb = el('label', null, x.nombre); lb.append(el('small', null, 'Total ' + fmt(tot) + ' ' + x.unidad + (conTerraza(p, d) && x.terraza > 0 ? ', con terraza' : '')));\n    const inp = el('input'); inp.type = 'number'; inp.min = 0; inp.max = tot; inp.step = '0.5'; inp.value = a[x.id] || 0; inp.dataset.id = x.id; inp.dataset.max = tot;\n    const b0 = el('button','btn chico','0'); b0.onclick = () => { inp.value = 0; };\n    const bt = el('button','btn chico','Todo'); bt.onclick = () => { inp.value = tot; };\n    r.append(lb, inp, b0, bt); box.append(r);\n  });\n  abre('vDep');\n}\n$('#depOk').onclick = () => {\n  const {p, d} = depAct, k = p + '-' + d;\n  const ant = D.avance[k] || {}, nuevo = {};\n  let malo = false;\n  $('#depPar').querySelectorAll('input').forEach(i => {\n    const v = num(i.value), mx = num(i.dataset.max);\n    if(v > mx){ malo = true; i.classList.add('temb'); setTimeout(() => i.classList.remove('temb'), 260); }\n    nuevo[i.dataset.id] = Math.min(v, mx);\n  });\n  if(malo) return;\n  const cambios = cfg.partidas.filter(x => (ant[x.id] || 0) !== (nuevo[x.id] || 0))\n    .map(x => x.nombre + ' ' + 'de ' + fmt(ant[x.id] || 0) + ' a ' + fmt(nuevo[x.id] || 0) + ' ' + x.unidad);\n  D.avance[k] = nuevo;\n  const con = $('#depCon').value, conAnt = D.asignado[k] || '';\n  if(con !== conAnt){\n    D.asignado[k] = con;\n    const t = D.trab.find(x => x.id === con);\n    cambios.push('contratista: ' + (t ? t.nombre : 'sin asignar'));\n  }\n  if(cambios.length){ anota((p === TECHO ? etiqueta(p) + ' área común' : codDep(p, d) + (d === 0 ? ' piso ' + etiqueta(p) : '')) + ': ' + cambios.join(', ')); guardar(); pintaTodo(); }\n  cierra($('#vDep'));\n};\n\n// ===== Asistencia =====\n$('#asiDia').value = ahora().slice(0,10);\n$('#asiDia').onchange = pintaAsis;\nfunction pintaAsis(){\n  const dia = $('#asiDia').value, box = $('#asiLista'); box.textContent = '';\n  const reg = D.asis[dia] || {};\n  const act = D.trab.filter(t => !t.baja && t.ing.slice(0,10) <= dia && (!t.ret || t.ret.slice(0,10) >= dia));\n  if(!act.length){ box.append(el('div','nota','No hay trabajadores activos ese día. Agrégalos en Trabajadores.')); return; }\n  act.forEach(t => {\n    const r = el('div','asi'), m = reg[t.id] || {};\n    r.append(el('span', null, t.nombre));\n    const bs = el('div','bs');\n    const hora = el('div','hora' + (m.e === 'antes' ? ' ver' : ''));\n    const hi = el('input'); hi.type = 'time'; hi.value = m.h || '13:00';\n    hora.append('Se fue a las', hi);\n    [['P','presente'],['F','falta'],['Se fue','antes']].forEach(([tx, e]) => {\n      const b = el('button','btn chico' + (m.e === e ? ' on' : ''), tx);\n      b.onclick = () => { marca(dia, t, e, hi.value); pintaAsis(); };\n      bs.append(b);\n    });\n    hi.onchange = () => { if((D.asis[dia] || {})[t.id]) marca(dia, t, 'antes', hi.value); };\n    r.append(bs, hora); box.append(r);\n  });\n}\nfunction marca(dia, t, e, h){\n  D.asis[dia] = D.asis[dia] || {};\n  D.asis[dia][t.id] = e === 'antes' ? {e, h:limpia(h, 5)} : {e};\n  anota('Asistencia ' + dia + ': ' + t.nombre + ' ' + (e === 'antes' ? 'se fue ' + h : e));\n  guardar();\n}\n\n// ===== Trabajadores =====\nlet tTemp = [];\nfunction rutOk(r){\n  r = r.replace(/[.\\-\\s]/g,'').toUpperCase();\n  if(!/^\\d{7,8}[\\dK]$/.test(r)) return false;\n  let s = 0, m = 2; for(let i = r.length - 2; i >= 0; i--){ s += +r[i] * m; m = m === 7 ? 2 : m + 1; }\n  const dv = 11 - s % 11; return (dv === 11 ? '0' : dv === 10 ? 'K' : String(dv)) === r.slice(-1);\n}\n$('#tAdd').onclick = () => {\n  const nom = limpia($('#tNom').value, 60), rut = limpia($('#tRut').value, 12);\n  if(!nom || !rutOk(rut)){ const b = $('#tAdd'); b.classList.add('temb'); setTimeout(() => b.classList.remove('temb'), 260); return; }\n  tTemp.push({id:'t' + Date.now().toString(36), nombre:nom, rut, cargo:limpia($('#tCar').value, 30), ing:limpia($('#tIng').value, 16) || ahora(), ret:'', baja:false, fin:'', anexos:[]});\n  $('#tNom').value = ''; $('#tRut').value = ''; $('#tIng').value = ahora();\n  pintaTrab();\n};\nfunction pintaTrab(){\n  const box = $('#tLista'); box.textContent = '';\n  if(!tTemp.length){ box.append(el('div','nota','Sin trabajadores todavía.')); return; }\n  tTemp.slice().sort((a, b) => a.baja - b.baja).forEach(t => {\n    const c = el('div','trab' + (t.baja ? ' baja' : ''));\n    const top = el('div','top');\n    const izq = el('div'); izq.append(el('b', null, t.nombre)); izq.append(el('div','nota', t.rut + ' - ' + t.cargo));\n    top.append(izq, el('span','est ' + (t.baja ? 'no' : 'ok'), t.baja ? 'Retirado' : 'Activo'));\n    c.append(top);\n    c.append(el('div','nota', 'Ingreso: ' + fmtFecha(t.ing) + (t.ret ? ' / Retiro: ' + fmtFecha(t.ret) : '')));\n    if(cfg.equipo.finiquitos && t.baja) c.append(el('div','nota', 'Finiquito: ' + (t.fin || 'pendiente')));\n    if(cfg.equipo.anexos && t.anexos.length) t.anexos.forEach(a => c.append(el('div','nota', 'Anexo ' + fmtFecha(a.f) + ': ' + a.txt)));\n    const acc = el('div','acc');\n    if(!t.baja){\n      const fr = el('input'); fr.type = 'datetime-local'; fr.value = ahora(); fr.style.height = '30px'; fr.style.border = '1px solid var(--linea)';\n      const bb = el('button','btn chico','Dar de baja');\n      bb.onclick = () => { t.baja = true; t.ret = limpia(fr.value, 16) || ahora(); t.fin = 'pendiente'; pintaTrab(); };\n      acc.append(fr, bb);\n    } else if(cfg.equipo.finiquitos && t.fin !== 'firmado'){\n      const bf = el('button','btn chico','Finiquito firmado');\n      bf.onclick = () => { t.fin = 'firmado'; pintaTrab(); };\n      acc.append(bf);\n    }\n    if(cfg.equipo.anexos){\n      const ai = el('input'); ai.placeholder = 'Anexo (ej. cambio de jornada)'; ai.maxLength = 80; ai.style.height = '30px'; ai.style.border = '1px solid var(--linea)'; ai.style.flex = '1';\n      const ba = el('button','btn chico','Agregar anexo');\n      ba.onclick = () => { const x = limpia(ai.value, 80); if(!x) return; t.anexos.push({f:ahora(), txt:x}); pintaTrab(); };\n      acc.append(ai, ba);\n    }\n    c.append(acc); box.append(c);\n  });\n}\n$('#tOk').onclick = () => {\n  const ant = {}; D.trab.forEach(t => ant[t.id] = t);\n  tTemp.forEach(t => {\n    const a = ant[t.id];\n    if(!a) anota('Alta: ' + t.nombre + ' (' + t.cargo + ') ingreso ' + fmtFecha(t.ing));\n    else {\n      if(!a.baja && t.baja) anota('Baja: ' + t.nombre + ' retiro ' + fmtFecha(t.ret));\n      if(a.fin !== 'firmado' && t.fin === 'firmado') anota('Finiquito firmado: ' + t.nombre);\n      if(t.anexos.length > a.anexos.length) t.anexos.slice(a.anexos.length).forEach(x => anota('Anexo ' + t.nombre + ': ' + x.txt));\n    }\n  });\n  D.trab = tTemp; guardar(); pintaTodo(); cierra($('#vTrab'));\n};\n\n// ===== Historial =====\nfunction pintaHis(){\n  const box = $('#hLista'); box.textContent = '';\n  if(!D.his.length){ box.append(el('div','nota','Todavía no hay cambios.')); return; }\n  D.his.forEach(h => { const r = el('div','his'); r.append(el('time', null, fmtFecha(h.t)), h.txt); box.append(r); });\n}\n\n// ===== Arranque =====\n$('#subt').textContent = cfg.obra.nombre + ' - v' + VER;\n$('#bEditar').onclick = () => parent.location.reload();\npintaTodo();\n(function(){\n  const c = $('#carga');\n  requestAnimationFrame(() => {\n    $('#l1').style.transform = 'translateY(-4px)'; $('#l2').style.transform = 'translateY(4px)';\n    c.classList.add('abre'); $('#cargaBar').style.width = '100%';\n  });\n  setTimeout(() => { $('#cargaEst').textContent = '¡Listo!'; }, 650);\n  setTimeout(() => { $('#app').classList.add('ok'); c.classList.add('fuera'); }, 950);\n  setTimeout(() => c.remove(), 1350);\n})();\n<\/script>\n<\/body>\n<\/html>\n";
