<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="16x16" href="img/icono-16.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="img/icono-48.png?v=1">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b2b36">
<meta name="robots" content="noindex">
<title>Iniciar sesión · Obra Bellavista</title>
<link rel="stylesheet" href="carga.css?v=5">
<style>
@view-transition{navigation:auto;}
  :root{
    --bg:#f2f3f1; --panel:#ffffff; --panel-soft:#f8f9f7; --border:#d7dad3; --border-strong:#b9bdb3;
    --text:#2c302c; --sub:#6c716a;
    --pendiente:#6c716a; --proceso:#ffc400; --entregado:#43a047; --pagado:#2461a8;
    --pagado-bg:rgba(36,97,168,.14); --pagado-border:rgba(36,97,168,.45);
    --pagado-pill-bg:rgba(36,97,168,.5); --pagado-pill-text:#eaf1fb;
    --accent:#2f6f8f; --accent2:#7a3fa0; --radius:2px;
  }
  body.dark{
    --bg:#14171a; --panel:#1d2124; --panel-soft:#23282c; --border:#333a3f; --border-strong:#454e54;
    --text:#e9ecee; --sub:#9aa3a9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  html{background:#f2f3f1;} html.dark{background:#14171a;color-scheme:dark;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.4;overflow:hidden;}
  .lg{--lg-azul:#0b2b36;--lg-mortero:#d9cdb8;--lg-frague:#8d8a84;position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);}
  body.dark .lg{--lg-mortero:#4a4338;--lg-frague:#2a2927;}
  .lg.off{display:none;}
  body.lg-on > *:not(#loginGate):not(#cargaGlobal){display:none !important;}
  .lg *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  .lg-app{position:relative;width:100%;max-width:440px;height:100dvh;max-height:860px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  @media (min-width:600px){.lg-app{border:1px solid var(--border-strong);box-shadow:0 10px 40px rgba(0,0,0,.18);}}
  @media (max-width:500px){.lg-app{max-width:none;max-height:none;}}
  @media (min-width:900px) and (min-height:600px){
    .lg{background:linear-gradient(135deg,#0b2b36 0%,#13505f 55%,#2f6f8f 100%);}
    .lg::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 56px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 56px);pointer-events:none;}
    .lg-app{max-width:780px;width:92vw;height:min(520px,92dvh);max-height:none;border:0;box-shadow:0 24px 70px rgba(0,0,0,.45);}
    .lg .lg-modo{position:fixed;top:18px;right:18px;width:44px;height:44px;border-color:rgba(255,255,255,.55);background:rgba(0,0,0,.25);}
    .lg-p.lg-form.on{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);padding:0;}
    .lg-form .lg-cab{flex-direction:column;justify-content:center;text-align:center;gap:16px;padding:28px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 48px),linear-gradient(170deg,#0b2b36 0%,#0b2b36 52%,#2f6f8f 135%);}
    .lg-form .lg-cab img{width:96px;height:96px;}
    .lg-form .lg-cab b{font-size:24px;line-height:1.15;}
    .lg-form .lg-cab span{font-size:14px;opacity:.85;display:block;margin-top:6px;}
    .lg-form .lg-cuerpo{padding:26px 40px 20px;justify-content:center;gap:12px;overflow:auto;}
    .lg-form .lg-titulo{font-size:21px;}
    .lg-form .lg-visor{min-height:48px;}
    .lg-form .lg-visor i{width:13px;height:13px;}
    .lg-form .lg-teclas{flex:0 0 auto;grid-template-rows:repeat(4,42px);max-height:none;}
    .lg-form .lg-teclas button{font-size:20px;}
    .lg-form .lg-recordar{padding:7px 10px;}
    .lg-form .lg-cuerpo{gap:10px;}
  }
  .lg-p{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .lg-p.on{display:flex;}
  .lg button{font-family:inherit;border-radius:0;cursor:pointer;}
  .lg-splash{background:var(--lg-azul);color:#fff;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;}
  .lg-splash img{width:112px;height:112px;display:block;animation:lgEntra .5s ease-out both;}
  .lg-splash h1{margin:0;font-size:20px;font-weight:700;line-height:1.25;animation:lgEntra .5s .12s ease-out both;}
  .lg-splash p{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.2px;min-height:24px;color:#fff;transition:opacity .16s ease,transform .16s ease;}
  .lg-splash p.out{opacity:0;transform:translateY(-8px);}
  .lg-splash p.in{animation:lgMsgIn .34s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes lgMsgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .lg-splash p.lgfin{color:#9fe3a8;}
  .lg-carga{width:min(280px,76%);animation:lgEntra .5s .24s ease-out both;}
  @keyframes lgEntra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .lg-barra{position:relative;width:100%;height:36px;background:var(--lg-frague);overflow:hidden;border:1px solid var(--lg-frague);}
  .lg-barra .mortero{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--lg-mortero) 0 3px,color-mix(in srgb,var(--lg-mortero) 82%,#000) 3px 5px);}
  .lg-barra .pl{position:absolute;opacity:0;transform:translateY(-9px) scale(1.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.18),0 1px 1px rgba(0,0,0,.25);}
  .lg-barra .pl.on{opacity:1;transform:none;transition:opacity .16s ease-out,transform .26s cubic-bezier(.2,.9,.3,1.25);}
  .lg-barra .pl::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%,rgba(0,0,0,.08) 100%);}
  .lg-cab{background:var(--lg-azul);color:#fff;padding:18px 20px 16px;display:flex;align-items:center;gap:14px;}
  .lg-cab img{width:44px;height:44px;display:block;flex:none;}
  .lg-cab div{min-width:0;}
  .lg-cab b{display:block;font-size:16px;line-height:1.2;}
  .lg-cab span{font-size:12px;opacity:.8;}
  .lg-cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 16px 14px;gap:14px;}
  .lg-titulo{margin:0;font-size:19px;}
  .lg-visor{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;border:2px solid var(--border-strong);background:var(--bg);padding:0 12px;}
  .lg-visor i{width:14px;height:14px;background:var(--text);display:block;animation:lgPunto .12s ease-out;}
  .lg-visor em{font-style:normal;color:var(--sub);font-size:14px;}
  @keyframes lgPunto{from{transform:scale(.3)}to{transform:none}}
  .lg-visor.error{border-color:#c0392b;animation:lgSacude .35s;}
  @keyframes lgSacude{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .lg-msg{min-height:20px;font-size:13.5px;font-weight:600;margin:-6px 0 0;text-align:center;}
  .lg-msg.mal{color:#c0392b;}
  body.dark .lg-msg.mal{color:#ef7b6e;}
  .lg-teclas{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(54px,1fr));gap:4px;max-height:420px;}
  .lg-teclas button{font-size:26px;font-weight:700;border:2px solid var(--text);background:var(--panel);color:var(--text);padding:0;}
  .lg-teclas button:active{background:var(--text);color:var(--panel);}
  .lg-teclas button.aux{font-size:15px;border-color:var(--border-strong);color:var(--sub);}
  .lg-teclas button.entrar{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-size:17px;}
  .lg-teclas button:disabled{opacity:.4;cursor:not-allowed;}
  .lg-recordar{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;border:2px solid var(--border-strong);padding:10px 12px;cursor:pointer;user-select:none;}
  .lg-recordar input{width:24px;height:24px;margin:0;accent-color:var(--accent);}
  .lg-recordar b{font-size:14px;display:block;}
  .lg-recordar span span{font-size:12px;color:var(--sub);}
  .lg-pie{font-size:11.5px;color:var(--sub);text-align:center;margin:0;}
  .lg-url{width:100%;min-height:54px;border:2px solid var(--border-strong);background:var(--bg);color:var(--text);padding:0 12px;font-size:14px;font-family:inherit;border-radius:0;}
  .lg-url:focus{outline:none;border-color:var(--accent);}
  .lg-btn{min-height:54px;border:0;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;padding:0 16px;}
  .lg-cuerpo p.lg-expl{margin:0;font-size:13px;color:var(--sub);line-height:1.45;}
  .lg-modo{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:8px;z-index:5;width:40px;height:40px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.18);color:#fff;font-size:16px;padding:0;}

  /* ===== Tema 4 · Marco dorado (solo noche) ===== */
  body.tema4{
    --marco-oscuro:#463714; --marco-oro:#785a28; --marco-oro-vivo:#c89b3c; --marco-hueco:#010a13;
    --marco-fondo:#1a1c21; --marco-fondo-arriba:#0c0d0f;
    --panel:#1a1c21; --panel-soft:#14161a; --border:#1e2126; --border-strong:#785a28;
    --text:#f0e6d2; --sub:#a09b8c; --accent:#c89b3c; --accent2:#785a28; --radius:0px;
    --pagado:#0d9488; --pagado-bg:rgba(13,148,136,.14); --pagado-border:rgba(13,148,136,.45);
    --pagado-pill-bg:rgba(13,148,136,.55); --pagado-pill-text:#eafaf7;
    color-scheme:dark;
  }
  /* El marco: todo contenedor con borde, sombra o fondo propio */
  body.tema4 :is(.tb-group,.toolbar,.pt,.stat-card,.modal,.mc-pop,.obj-item,.worker-panel,.vt-sec,.rec-item,.aviso-grupo,.lg-app){
    position:relative;
    border:2px solid transparent;
    border-image:linear-gradient(to right,var(--marco-oscuro) 0%,var(--marco-oro) 40%) 1;
    background:linear-gradient(180deg,var(--marco-fondo-arriba) 0%,var(--marco-fondo) 70%);
    border-radius:0; box-shadow:none;
  }
  body.tema4 .overlay{background:rgba(1,10,19,.72);}
  /* Colores que daban información: se conservan como una franja interior */
  body.tema4 .stat-card.st-pendiente{box-shadow:inset 0 3px 0 var(--pendiente);}
  body.tema4 .stat-card.st-proceso{box-shadow:inset 0 3px 0 var(--proceso);}
  body.tema4 .stat-card.st-entregado{box-shadow:inset 0 3px 0 var(--entregado);}
  body.tema4 .stat-card.st-pagado{box-shadow:inset 0 3px 0 var(--pagado);}
  body.tema4 .stat-card.st-retenido{box-shadow:inset 0 3px 0 #a97e00;}
  body.tema4 .rec-item{box-shadow:inset 6px 0 0 var(--proceso);background:linear-gradient(180deg,#1d1a0e 0%,#1a1810 70%);}
  body.tema4 .rec-item.atrasado{box-shadow:inset 6px 0 0 #c0392b;background:linear-gradient(180deg,#26100e 0%,#1d1210 70%);}
  body.tema4 .obj-item{box-shadow:inset 6px 0 0 var(--accent);}
  body.tema4 .pt{border-top-width:2px;}
  /* Encabezado de la ventana de departamento y del panel */
  body.tema4 .vt-head{background:linear-gradient(90deg,var(--marco-oscuro),var(--marco-fondo));color:var(--text);border-bottom:1px solid var(--marco-oro);}
  body.tema4 #ventanaOverlay .vt-head h3{color:var(--text);}
  body.tema4 header.top{border-image:linear-gradient(90deg,var(--marco-oscuro),var(--marco-oro-vivo)) 1;}
  body.tema4 .vt-sec-title{background:var(--marco-fondo-arriba);border-bottom-color:var(--separador,#1e2126);}
  /* Botones: esquinas rectas; con acento, borde dorado */
  body.tema4 .btn,body.tema4 select,body.tema4 input,body.tema4 textarea,body.tema4 .tab,body.tema4 .stats-tab{border-radius:0;}
  body.tema4 .btn{background:var(--marco-fondo);border-color:var(--marco-oro);color:var(--text);}
  body.tema4 .btn:hover:not(:disabled){border-color:var(--marco-oro-vivo);}
  body.tema4 .btn.primary{background:linear-gradient(180deg,#2a2210,#1f1a0d);border-color:var(--marco-oro-vivo);color:#f6e7bd;}
  body.tema4 .tab.active,body.tema4 .stats-tab.activa{background:linear-gradient(180deg,#3a2d12,#2a2210);color:#f6e7bd;border-color:var(--marco-oro-vivo);}
  body.tema4 select,body.tema4 input[type=text],body.tema4 input[type=number],body.tema4 textarea{background:var(--marco-fondo-arriba);border-color:var(--marco-oro);color:var(--text);}
  body.tema4 .floor-title h2{position:relative;border:2px solid transparent;border-image:linear-gradient(to right,var(--marco-oscuro) 0%,var(--marco-oro) 40%) 1;background:linear-gradient(180deg,var(--marco-fondo-arriba) 0%,var(--marco-fondo) 70%);border-radius:0;box-shadow:none;padding:5px 12px;}
  body.tema4 .floor-title .line{background:var(--marco-oro);}

  /* Rendimiento: el difuminado del fondo y el brillo infinito de las pestañas quedan guardados pero apagados.
     Para volver a encenderlos: agrega la clase "blur-fondo" o "brillo-pestanas" al <body>. */
  body.blur-fondo .overlay{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
  body:not(.brillo-pestanas) .tab.active,body:not(.brillo-pestanas) .stats-tab.activa{animation:none;box-shadow:0 0 8px 1px rgba(160,110,255,.55), inset 0 0 8px rgba(255,255,255,.16);}
  body:not(.brillo-pestanas) .tab.active::after,body:not(.brillo-pestanas) .stats-tab.activa::after{animation:none;display:none;}
  .overlay.show .modal{will-change:transform,opacity;}


  /* ===== Temas A–D: formas de ver pisos y departamentos ===== */
  .ribbon-flag.estado-badge{display:inline-flex;align-items:center;justify-content:center;height:26px;padding-top:0;padding-bottom:0;line-height:1;}
  .vt-head .ribbon-flag.estado-badge{width:auto;}
  body.dz-A table.dept-table,body.dz-D table.dept-table{border-collapse:collapse;border-spacing:0 !important;}
  body.dz-A table.dept-table :is(th,td),body.dz-D table.dept-table :is(th,td){border:1px solid var(--border-strong);}
  body.dz-A table.dept-table td.cell-td,body.dz-D table.dept-table td.cell-td{border-left-width:4px;}
  body.dz-A table.dept-table td.cell-td.st-pendiente,body.dz-D table.dept-table td.cell-td.st-pendiente{border-left-color:var(--pendiente);}
  body.dz-A table.dept-table td.cell-td.st-proceso,body.dz-D table.dept-table td.cell-td.st-proceso{border-left-color:var(--proceso);}
  body.dz-A table.dept-table td.cell-td.st-entregado,body.dz-D table.dept-table td.cell-td.st-entregado{border-left-color:var(--entregado);}
  body.dz-A table.dept-table td.cell-td.st-pagado,body.dz-D table.dept-table td.cell-td.st-pagado{border-left-color:var(--pagado);}
  body.dz-A td.dpto-col,body.dz-D td.dpto-col{position:sticky;left:0;z-index:3;}
  /* Temas 5 y 8: el "!" de materiales va en la esquina, sin agregar altura al cuadro */
  body.dz-A table.dept-table td.dpto-col.mat-pend,body.dz-A table.dept-table td.dpto-col.mat-prep,
  body.dz-D table.dept-table td.dpto-col.mat-pend,body.dz-D table.dept-table td.dpto-col.mat-prep{padding-top:8px;}
  @media (max-width:700px){body.dz-A table.dept-table td.dpto-col.mat-pend,body.dz-A table.dept-table td.dpto-col.mat-prep,body.dz-D table.dept-table td.dpto-col.mat-pend,body.dz-D table.dept-table td.dpto-col.mat-prep{padding-top:4px;}
  body.dz-A td.dpto-col.mat-pend::before,body.dz-A td.dpto-col.mat-prep::before,body.dz-D td.dpto-col.mat-pend::before,body.dz-D td.dpto-col.mat-prep::before{top:0;left:0;width:12px;height:12px;font-size:9px;line-height:12px;}}
  body.dz-A td.dpto-col.mat-pend::before,body.dz-A td.dpto-col.mat-prep::before,
  body.dz-D td.dpto-col.mat-pend::before,body.dz-D td.dpto-col.mat-prep::before{top:3px;left:3px;margin-left:0;width:15px;height:15px;font-size:10px;line-height:15px;}
  body.dz-A .cell-td[class*="st-"]{background:var(--panel);box-shadow:none;}
  body.dz-A table.dept-table tbody tr:nth-child(even) td.cell-td[class*="st-"]{background:var(--panel-soft);}
  body.dz-D .cell-td.st-pendiente{background:color-mix(in srgb,var(--pendiente) 16%,var(--panel));box-shadow:none;}
  body.dz-D .cell-td.st-proceso{background:color-mix(in srgb,var(--proceso) 24%,var(--panel));box-shadow:none;}
  body.dz-D .cell-td.st-entregado{background:color-mix(in srgb,var(--entregado) 22%,var(--panel));box-shadow:none;}
  body.dz-D .cell-td.st-pagado{background:color-mix(in srgb,var(--pagado) 24%,var(--panel));box-shadow:none;}
  .dz-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  @media (min-width:1100px){.dz-cards{grid-template-columns:repeat(4,minmax(0,1fr));}}
  .dz-card{background:var(--panel);border:1px solid var(--border-strong);min-width:0;}
  .dz-ch{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel-soft);border-bottom:1px solid var(--border-strong);}
  .dz-ch b{font-size:18px;color:var(--text);margin-right:auto;}
  .dz-seg,.dz-bars{display:flex;gap:2px;}
  .dz-seg i{display:block;width:22px;height:8px;}
  .dz-bars i{display:block;flex:1;height:8px;}
  .dz-seg i,.dz-bars i,.dz-leg i{background:var(--border-strong);}
  :is(.dz-seg,.dz-bars,.dz-leg) i.st-pendiente{background:var(--pendiente);}
  :is(.dz-seg,.dz-bars,.dz-leg) i.st-proceso{background:var(--proceso);}
  :is(.dz-seg,.dz-bars,.dz-leg) i.st-entregado{background:var(--entregado);}
  :is(.dz-seg,.dz-bars,.dz-leg) i.st-pagado{background:var(--pagado);}
  .dz-fl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);}
  .dz-ch + .dz-fl{border-top:0;}
  .dz-cards .dz-fl{grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 10px;}
  .dz-fila .dz-info{flex:1 1 auto;}
  .dz-fila .worker-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  :is(.dz-fila,.dz-ex) .worker-name{background:none;border:0;padding:0;font-size:15px;box-shadow:none;}
  :is(.dz-fila,.dz-ex) .worker-name.unassigned{border:0;font-weight:500;}
  :is(.dz-ex,.dz-fila) .estado-badge{width:min(var(--ancho-estado),96px);}
  .dz-ex.cell-ventana{flex-direction:column;align-items:flex-start;gap:3px;padding:4px 2px;}
  .dz-ex1{display:flex;align-items:center;gap:8px;min-width:0;}
  .dz-ex1 .worker-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dz-ex2 .price-block{justify-content:flex-start;}
  .dz-ar{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sub);}
  .dz-cl{min-width:0;}
  .dz-fila.cell-ventana{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;}
  .dz-fila .dz-info{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .dz-fila .estado-badge{flex:none;align-self:center;}

.dz-ch .ns,.dz-tile .ns{display:none;}.dz-ch .ns i,.dz-tile .ns i{font-style:normal;display:block;font-size:10px;line-height:1;opacity:.85;}.dz-ch .ns i::before,.dz-tile .ns i::before{content:"P";}
@media (max-width:700px){
  .dz-ch b .nf,.dz-tile b .nf{display:none !important;}

  }

.as-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}

async function llamarLoginUna(extra){
  const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  const corte = ctl ? setTimeout(() => ctl.abort(), 20000) : 0;
  try{
    const res = await fetch(DB_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, signal: ctl ? ctl.signal : undefined, body: JSON.stringify(Object.assign({action:'login', dispositivo: ls('progresoObraDisp') || '', dispositivoEtiqueta: etiquetaDispositivo()}, extra))});

  }catch(e){ return null; }
  finally{ if(corte) clearTimeout(corte); }

async function llamarLogin(extra){

  try{ const t = ss('hubSesion') || ls('hubSesion'); const h = t ? JSON.parse(t) : null; return (h && h.token && Array.isArray(h.secciones)) ? h : null; }catch(e){ return null; }

    lg('lgModo').textContent = d ? 'Modo claro' : 'Modo oscuro'; ls('progresoObraTheme', d ? 'dark' : 'light');
    if(window.google && google.accounts && gBotonListo) pintarGoogle();
  });
  document.querySelectorAll('.lg-logo').forEach(i => { i.src = 'img/logo-menu.png?v=1'; });
  document.querySelectorAll('.lg-sq').forEach(i => { i.src = 'img/logo-ingreso.png?v=1'; });   // @@bienvenida-dibujo
})();

// ---- PIN ----
const gate = {pin: '', fallos: 0, bloqueado: false, ocupado: false};
function gatePintar(){
  lg('lgVisor').innerHTML = gate.ocupado ? '<span class="lg-espera" role="status" aria-label="Verificando"></span>' : gate.pin ? gate.pin.split('').map(() => '<i></i>').join('') : '<em>' + (window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches ? 'Escribe tu PIN o usa los números' : 'Toca los números') + '</em>';
  const b = lg('lgEntrar'); b.disabled = gate.pin.length < 4 || gate.bloqueado || gate.ocupado;
  b.textContent = gate.ocupado ? '…' : 'Entrar';
}
function gateMensaje(t, mal){ const m = lg('lgMsgPin'); m.textContent = t; m.className = 'lg-msg' + (mal ? ' mal' : ''); }
function gateSumar(n){ if(gate.bloqueado || gate.ocupado || gate.pin.length >= 12) return; gate.pin += n; gateMensaje(''); gatePintar(); if(gate.pin.length === 4){ const d = ls('destinoPreferido'); precargar(PAGINAS[d] ? d : 'panel'); } }
function gateBloquear(seg, texto){
  gate.bloqueado = true; let q = seg; gatePintar(); gateMensaje(`${texto} Espera ${q} s`, true);
  const t = setInterval(() => { q--; gateMensaje(`${texto} Espera ${q} s`, true); if(q <= 0){ clearInterval(t); gate.bloqueado = false; gate.fallos = 0; gateMensaje(''); gatePintar(); } }, 1000);
}
function sacudir(){ const v = lg('lgVisor'); v.classList.remove('error'); void v.offsetWidth; v.classList.add('error'); }
function resultado(res, recordar, via){
  if(res === null){ gateMensaje('No se pudo conectar. Revisa tu internet e intenta de nuevo.', true); return; }
  if(!res.ok){
    if(res.error === 'dispositivo_ocupado'){ sacudir(); gate.pin = ''; gatePintar(); gateMensaje(res.tipo === 'unico' ? 'Esta cuenta ya está abierta en otro aparato. Por defecto solo se permite 1 aparato por cuenta. Cierra la sesión allá o pídele al administrador que te autorice un celular/tablet.' : 'Esta cuenta ya está abierta en otro ' + (res.tipo === 'pc' ? 'computador' : 'celular o tablet') + '. Cierra la sesión allá o pídele al administrador que libere el cupo.', true); return; }
    if(res.error === 'ocupado'){ gateMensaje('El servidor sigue ocupado. Tu PIN no se contó como error; toca Entrar de nuevo en unos segundos.', true); return; }
    if(res.error === 'bloqueado'){ gate.pin = ''; gatePintar(); bloqueadoFlujo(res); return; }
    if(res.error === 'demasiados_intentos'){ sacudir(); gate.pin = ''; gatePintar(); gateBloquear(30, 'Demasiados intentos seguidos.'); return; }
    if(via === 'google'){ gateMensaje('Ese Gmail no está autorizado. Pídele al administrador que lo agregue.', true); return; }
    gate.fallos++; sacudir(); gate.pin = ''; gatePintar();
    if(gate.fallos >= 5){ gateBloquear(15, 'Demasiados intentos en este aparato.'); }
    else gateMensaje(`PIN incorrecto. Te quedan ${5 - gate.fallos} intentos`, true);
    return;
  }
  if(!SECC_BASE[res.rol]){ gateMensaje('Esa cuenta no tiene un cargo válido en la pestaña "Usuarios".', true); return; }
  gate.pin = ''; gate.fallos = 0; gatePintar();
  if(!Array.isArray(res.secciones)) res.secciones = SECC_BASE[res.rol].slice();
  guardarHub({token: res.token || '', nombre: res.nombre || '', rol: res.rol, secciones: res.secciones, recordar: !!recordar});
  bienvenida(res).then(() => elegir(res, recordar));
}
const CARGO_TXT = {1: 'Administrador', 2: 'Supervisor', 3: 'Trabajador', 4: 'Jefe de Terreno', 5: 'Calidad', 6: 'Oficina Técnica', 7: 'Jefe de Bodega'};
function saludoDe(nombre){
  const p = String(nombre || '').split(/\s+/).filter(x => x && !/\.$/.test(x));
  const primero = (p[0] || '').toLowerCase();
  return /a$/.test(primero) ? 'Bienvenida' : 'Bienvenido';
}
async function bienvenida(res, bloqueo){
  const nom = limpioNombre(res.nombre || '') || (bloqueo ? 'Usuario' : 'Admin');
  lg('lgV3s').textContent = saludoDe(nom); lg('lgV3n').textContent = nom; lg('lgV3c').textContent = (res.rol === 1 ? (/^ismael\b/i.test(nom) ? 'Dev' : 'Admin') : CARGO_TXT[res.rol]) || 'Usuario';
  const v = lg('lgV3'), inn = lg('lgV3in');
  v.classList.remove('ver', 'err', 'errver'); inn.classList.remove('tiembla'); v.style.height = '0px';
  pantalla('lgHecho');
  await new Promise(ok => requestAnimationFrame(() => requestAnimationFrame(ok)));
  let H = inn.scrollHeight + 4;
  setTimeout(() => v.classList.add('ver'), 260);
  await animAlto(v, 0, H, 480);
  if(!bloqueo){ await dormir(1300); }
  else {
    await dormir(900);
    lg('lgV3errT').textContent = bloqueo;
    v.classList.add('err');
    const H2 = inn.scrollHeight + 4;
    v.classList.add('errver'); inn.classList.add('tiembla');
    await animAlto(v, H, H2, 260); H = H2;
    await dormir(3000);
  }
  v.classList.remove('ver'); await dormir(200);
  await animAlto(v, H, 0, 450);
}
async function bloqueadoFlujo(res){
  gate.bloqueado = true; gatePintar();
  const txt = res.permanente ? 'Usuario bloqueado. Comunícate conmigo (Ismael) para desbloquear.' : 'Usuario bloqueado hasta el ' + new Date(res.hasta).toLocaleDateString('es-CL') + '.';
  await bienvenida(res, txt);
  gate.bloqueado = false; gate.pin = ''; gate.fallos = 0; gateMensaje(''); gatePintar();
  pantalla('lgPin');
}
function mensajeElegir(t, mal){ const m = lg('lgMsgElegir'); m.textContent = t || ''; m.className = 'lg-msg' + (mal ? ' mal' : ''); }
// secciones que el admin escondió en el inicio (llegan del servidor al entrar y al refrescar)
let OCULTAS = [];
try{ OCULTAS = JSON.parse(ls('ocultasInicio') || '[]'); if(!Array.isArray(OCULTAS)) OCULTAS = []; }catch(e){ OCULTAS = []; }
function guardarOcultas(l){ if(!Array.isArray(l)) return; OCULTAS = l.filter(x => x !== 'admin'); ls('ocultasInicio', JSON.stringify(OCULTAS)); }
function mostrarOpciones(lista){
  const pref = ls('destinoPreferido');
  document.querySelectorAll('.lg-dest button').forEach(b => {
    if(b.dataset.dest !== 'admin' && OCULTAS.indexOf(b.dataset.dest) !== -1){ b.hidden = true; return; }
    b.hidden = false;
    const bloq = !accede(lista, b.dataset.dest);
    if(b.dataset.dest === 'admin'){ b.hidden = bloq; if(bloq) return; }
    b.classList.toggle('lock', bloq); b.setAttribute('aria-disabled', bloq ? 'true' : 'false');
    b.classList.toggle('pref', !bloq && b.dataset.dest === pref);
  });
  return pref;
}
function elegir(res, recordar, aviso){
  lg('lgQuien').textContent = 'Hola, ' + limpioNombre(res.nombre || 'Admin') + '. Elige a dónde ir.';
  mensajeElegir(aviso || '', !!aviso);
  guardarOcultas(res.ocultas);
  const pref = mostrarOpciones(res.secciones || SECC_BASE[res.rol] || []);
  datosElegir = {res, recordar};
  if(res.encargados) aplicarEncargados(res.encargados);
  pantalla('lgElegir');
  if(PAGINAS[pref] && accede(res.secciones || [], pref) && OCULTAS.indexOf(pref) === -1) precargar(pref);
}
async function refrescarAcceso(){
  if(!datosElegir || !datosElegir.res.token) return;
  const r = await llamarApi({action: 'miAcceso', token: datosElegir.res.token});
  if(!r || !datosElegir) return;
  if(!r.ok){
    if(r.error === 'sin_sesion'){ limpiarTodo(); datosElegir = null; pantalla('lgPin'); gateMensaje('Tu sesión venció. Ingresa tu PIN de nuevo.', true); }
    return;
  }
  if(r.encargados) aplicarEncargados(r.encargados);
  guardarOcultas(r.ocultas);
  if(Array.isArray(r.secciones)){
    datosElegir.res.secciones = r.secciones;
    guardarHub({token: datosElegir.res.token, nombre: datosElegir.res.nombre, rol: datosElegir.res.rol, secciones: r.secciones, recordar: datosElegir.recordar});
    mostrarOpciones(r.secciones);
  }
}
let datosElegir = null;
function limpioNombre(n){ return String(n || '').replace(/[.\s]+$/, ''); }
async function intentarPin(){
  if(gate.bloqueado || gate.ocupado || gate.pin.length < 4) return;
  gate.ocupado = true; gatePintar(); gateMensaje('Verificando…');
  const res = await llamarLogin({pin: gate.pin});
  gate.ocupado = false; gateMensaje(''); gatePintar();
  resultado(res, lg('lgRecordar').checked, 'pin');
}
(function(){
  const teclas = lg('lgTeclas');
  ['1','2','3','4','5','6','7','8','9'].forEach(n => teclas.insertAdjacentHTML('beforeend', `<button type="button" data-n="${n}">${n}</button>`));
  teclas.insertAdjacentHTML('beforeend', '<button type="button" class="aux" id="lgBorrar" aria-label="Borrar">⌫ Borrar</button><button type="button" data-n="0">0</button><button type="button" class="entrar" id="lgEntrar" disabled>Entrar</button>');
  teclas.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b || b.disabled) return;
    if(b.dataset.n !== undefined) gateSumar(b.dataset.n);
    else if(b.id === 'lgBorrar'){ gate.pin = gate.pin.slice(0, -1); gateMensaje(''); gatePintar(); }
    else if(b.id === 'lgEntrar') intentarPin();
  });
  document.addEventListener('keydown', e => {
    if(!lg('lgPin').classList.contains('on')) return;
    if(/^\d$/.test(e.key)) gateSumar(e.key);
    else if(e.key === 'Backspace'){ gate.pin = gate.pin.slice(0, -1); gatePintar(); }
    else if(e.key === 'Enter') intentarPin();
  });
  lg('lgRecordar').addEventListener('change', () => {
    lg('lgTxtRecordar').textContent = lg('lgRecordar').checked ? 'Entrarás directo, sin PIN. Dura de 7 a 30 días según tu cuenta.' : 'Pedirá el PIN cada vez que cierres y abras el navegador';
  });
  document.querySelectorAll('.lg-dest button').forEach(b => b.addEventListener('click', () => {
    const dest = b.dataset.dest;
    if(!datosElegir) return;
    if(!accede(datosElegir.res.secciones || [], dest)){ mensajeElegir('No tienes acceso a «' + NOM_SECC[dest] + '». Si lo necesitas, pídele autorización al administrador.', true); return; }
    guardar(datosElegir.res, datosElegir.recordar, dest);
    b.classList.add('marcado'); b.setAttribute('aria-pressed','true');
    document.querySelectorAll('.lg-dest button').forEach(x => { if(x !== b) x.style.pointerEvents = 'none'; });
    irA(dest);
  }));
  lg('lgSalir').addEventListener('click', () => { limpiarTodo(); datosElegir = null; pantalla('lgPin'); });
  gatePintar();
})();

// ---- Google ----
let gBotonListo = false;
function pintarGoogle(){
  const cont = lg('gBtn'); cont.innerHTML = '';
  const w = Math.max(200, Math.min(320, cont.clientWidth || 300));
  google.accounts.id.renderButton(cont, {type:'standard', theme: document.body.classList.contains('dark') ? 'filled_black' : 'outline', size:'large', text:'continue_with', shape:'rectangular', logo_alignment:'left', locale:'es', width: w});
}
async function alRecibirGoogle(resp){
  if(!resp || !resp.credential) return;
  if(gate.ocupado) return;
  gate.ocupado = true; gatePintar(); gateMensaje('Verificando tu cuenta…');
  const res = await llamarLogin({credential: resp.credential});
  gate.ocupado = false; gateMensaje(''); gatePintar();
  resultado(res, lg('lgRecordar').checked, 'google');
}
function iniciarGoogle(){
  if(!GOOGLE_CLIENT_ID) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  s.onload = () => {
    try{
      google.accounts.id.initialize({client_id: GOOGLE_CLIENT_ID, callback: alRecibirGoogle, auto_select: false, cancel_on_tap_outside: true});
      lg('gBloque').classList.add('on'); gBotonListo = true; pintarGoogle();
    }catch(e){}
  };

}
/*GOOGLE_INIT*/

// ---- arranque ----
(function(){
  const params = new URLSearchParams(location.search);
  const aviso = ss('progresoObraAvisoGate'); ss('progresoObraAvisoGate', null);
  if(params.get('s')){
    limpiarTodo();
    if(aviso) gateMensaje(aviso, true);
    history.replaceState(null, '', location.pathname);
  } else {
    let hub = leerHub() || hubLegacy();
    if(!hub && window.__PRUEBA && params.get('menu')) hub = {token: '', nombre: 'Ismael', rol: 1, secciones: SECC_BASE[1].slice(), recordar: true};
    if(hub){
      const lista = hub.secciones;
      const resHub = {token: hub.token, nombre: hub.nombre, rol: hub.rol, secciones: lista};
      const pref = ls('destinoPreferido');
      if(!params.get('menu')){
        const directo = lista.length === 1 ? lista[0] : (pref && accede(lista, pref) ? pref : '');
        if(directo){ guardar(resHub, hub.recordar, directo); irA(directo); return; }
      }
      history.replaceState(null, '', location.pathname);
      elegir(resHub, hub.recordar, aviso);
      refrescarAcceso();
      return;
    }
    if(aviso) gateMensaje(aviso, true);
  }
  iniciarGoogle();
  const idle = window.requestIdleCallback || (f => setTimeout(f, 1200));
  idle(() => { const d = ls('destinoPreferido'); precargar(PAGINAS[d] ? d : 'panel'); });
})();
</script>
