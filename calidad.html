<style>
:root{--bg:#f2f3f1;--panel:#fff;--soft:#f8f9f7;--border:#d7dad3;--strong:#b9bdb3;--text:#2c302c;--sub:#6c716a;--ok:#2e8b3a;--warn:#d99a00;--bad:#c0392b;--accent:#2f6f8f;--accent2:#7a3fa0;--head:#0f2f3b;}
@media (prefers-color-scheme:dark){:root{--bg:#14181a;--panel:#1d2326;--soft:#232a2d;--border:#333c40;--strong:#46525a;--text:#e6eaea;--sub:#9aa5a8;--ok:#4fb85b;--warn:#f0b400;--bad:#e5604f;}}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
button,input,select{font-family:inherit;border-radius:0;}
button{cursor:pointer;}
header{background:var(--head);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
header h1{font-size:16px;margin:0;flex:1;line-height:1.25;}
header small{display:block;font-weight:400;font-size:12px;opacity:.75;}
.btn{border:1px solid var(--strong);background:var(--panel);color:var(--text);padding:9px 14px;font-size:13px;min-height:40px;transition:transform .08s ease,box-shadow .12s ease,border-color .12s ease;}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.22);border-color:var(--accent);}
.btn:not(:disabled):active{transform:scale(.95);box-shadow:none;}
.btn:disabled{opacity:.5;cursor:wait;}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
header .btn{padding:9px 12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.45);}
main{max-width:860px;margin:0 auto;padding:16px;}
.msg{font-size:12.5px;color:var(--sub);margin:0 0 12px;}
.barra{display:flex;gap:10px;align-items:stretch;margin-bottom:12px;flex-wrap:wrap;}
.barra select{flex:1 1 150px;min-height:40px;padding:7px 10px;border:1px solid var(--strong);background:var(--panel);color:var(--text);font-size:14px;}
.resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px;}
.res{background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--strong);padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
.res b{font-size:20px;line-height:1.1;}
.res span{font-size:11.5px;color:var(--sub);}
.res.n{border-top-color:var(--strong);}.res.p{border-top-color:var(--warn);}.res.r{border-top-color:var(--ok);}.res.o{border-top-color:var(--bad);}
.piso{margin-bottom:20px;}
.piso h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.lista{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.tile{font-family:inherit;transition:transform .1s ease,box-shadow .12s ease,border-color .15s ease,background .15s ease;background:var(--panel);color:var(--text);border:1px solid var(--border);border-top:4px solid var(--warn);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;text-align:center;transition:transform .1s ease,box-shadow .12s ease,border-color .12s ease;}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2);border-color:var(--accent);}
.tile:active{transform:scale(.95);}
.tile.n{background:var(--soft);border-top-color:var(--strong);cursor:default;color:var(--sub);}.tile.n:hover{transform:none;box-shadow:none;border-color:var(--border);}.tile.n small{color:var(--sub);font-weight:500;}.tile.anim{animation:tileIn .28s ease both;}@keyframes tileIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}.tile.r{border-top-color:var(--ok);}.tile.o{border-top-color:var(--bad);}
.tile b{font-size:17px;line-height:1.1;overflow-wrap:anywhere;}
.tile.pas b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;}
.tile small{font-size:11px;font-weight:600;color:var(--warn);}
.tile.r small{color:var(--ok);}.tile.o small{color:var(--bad);}
.vacio{padding:36px 16px;text-align:center;color:var(--sub);border:1px dashed var(--strong);background:var(--panel);}
#vel,#velReg{position:fixed;inset:0;background:rgba(20,22,20,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
#vel.on,#velReg.on{display:flex;animation:overlayIn .16s ease;}
#vel.out,#velReg.out{animation:overlayOut .14s ease forwards;}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}
@keyframes modalPop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes modalPopOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.96);}}
.modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--strong);padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;animation:modalPop .16s ease;}
#vel.out .modal,#velReg.out .modal{animation:modalPopOut .14s ease forwards;}
body.bloq{overflow:hidden;}
.modal h2{margin:0;font-size:17px;}
.modal .sub{font-size:12.5px;color:var(--sub);margin-top:-6px;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.seg button{transition:background .18s ease,border-color .18s ease,color .18s ease,transform .08s ease;border:1px solid var(--strong);background:var(--panel);color:var(--text);padding:10px 4px;font-size:12.5px;font-weight:600;min-height:44px;margin-left:-1px;}
.seg button:first-child{margin-left:0;}
.seg button:hover{border-color:var(--accent);position:relative;}
.seg button:active{transform:scale(.96);}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.seg button.on[data-e="revisado"]{background:var(--ok);border-color:var(--ok);}
.seg button.on[data-e="observado"]{background:var(--bad);border-color:var(--bad);}
.seg button.on[data-e="pendiente"]{background:var(--warn);border-color:var(--warn);color:#2c302c;}
.campo{display:flex;flex-direction:column;gap:5px;}
.campo label{font-size:12px;font-weight:600;color:var(--sub);}
.campo input{min-height:42px;padding:8px 10px;font-size:15px;border:1px solid var(--strong);background:var(--soft);color:var(--text);width:100%;}
.campo input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.fila2{display:grid;grid-template-columns:1fr 110px;gap:10px;overflow:hidden;max-height:90px;opacity:1;transition:max-height .22s ease,opacity .2s ease,margin .22s ease;}
.fila2.oculto{max-height:0;opacity:0;margin-top:-12px;pointer-events:none;}
.campo input[type=number]{-moz-appearance:textfield;appearance:textfield;}
.campo input::-webkit-outer-spin-button,.campo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal.reg{max-width:560px;}
.reglista{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:60vh;}
.regit{border:1px solid var(--border);border-left:4px solid var(--accent);background:var(--soft);padding:9px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px;}
.regit b{font-size:13.5px;}
.regit .meta{font-size:11.5px;color:var(--sub);}
.regit .cambio{font-size:12.5px;overflow-wrap:anywhere;}
.regvacio{padding:24px 10px;text-align:center;color:var(--sub);font-size:13px;}
.acciones.uno{grid-template-columns:1fr;}
.tile{position:relative;overflow:hidden;}
.tile.esperando{cursor:wait;opacity:.8;}
.tile.esperando:hover{transform:none;box-shadow:none;border-color:var(--border);}
.tile .espera{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;animation:esperaBarra 3s linear forwards;}
@keyframes esperaBarra{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.err{min-height:16px;font-size:12.5px;color:var(--bad);}
</style>
</head>

const PISO_REVISADO_HASTA = 9;
let celdas = {};
let revisiones = {};
let cargando = false;
let actual = null;
let estadoSel = '';
const ESPERA_MS = 3000;
const espera = {};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clave = d => d.p + '|' + d.d;

async function llamar(action, extra){
  const res = await fetch(DB_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, ...extra})});
  if(!res.ok) throw new Error('red');
  return JSON.parse(await res.text());
}

function estado(d){
  const evaluar = lista => {
    const req = lista.filter(([id, , m]) => { const c = celdas[id]; return m || (c && (c.t || c.m)); });
    if(!req.length) return {ok:false, ts:0, hay:false};
    let ts = 0;
    const ok = req.every(([id]) => { const c = celdas[id]; if(c && c.t){ ts = Math.max(ts, c.ts || 0); return true; } return false; });
    return {ok, ts, hay:true};
  };
  const a = evaluar(d.cer), b = evaluar(d.fra);
  return {ok: a.ok && b.ok, ts: Math.max(a.ts, b.ts), cer: a.ok, fra: b.ok};
}

function revision(d){
  const r = revisiones[clave(d)];
  if(r) return r;
  return d.n <= PISO_REVISADO_HASTA ? {e:'revisado', d:'', c:0, base:true} : {e:'pendiente', d:'', c:0};
}

function nuevoNonce(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (window.crypto || {getRandomValues: a => a.forEach((_, i) => { a[i] = Math.floor(Math.random() * 256); })}).getRandomValues(b);
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function marcarEspera(k){
  espera[k] = Date.now() + ESPERA_MS;
  setTimeout(() => { delete espera[k]; quitarEspera(k); }, ESPERA_MS + 30);
}

function quitarEspera(k){
  const t = [...document.querySelectorAll('.tile[data-k]')].find(x => x.dataset.k === k);
  if(!t) return;
  t.classList.remove('esperando');
  const b = t.querySelector('.espera');
  if(b) b.remove();
}

function falta(e){
  if(!e.cer && !e.fra) return 'Falta cerámica y frague';
  return e.cer ? 'Falta frague' : 'Falta cerámica';
}

function etiqueta(r){
  if(r.e === 'revisado') return '✓ Revisado';
  if(r.e === 'observado') return '⚠ ' + (r.c || 1) + ' obs.';
  return 'Por revisar';
}
const claseEstado = e => e === 'revisado' ? 'r' : e === 'observado' ? 'o' : '';

let primerPintado = true;
function pintar(){
  const todos = LAYOUT.map(d => { const e = estado(d); return {d, e, r: e.ok ? revision(d) : {e:'nolisto', d:'', c:0}}; });
  const cuenta = k => todos.filter(x => x.r.e === k).length;
  $('nPend').textContent = cuenta('pendiente');
  $('nRev').textContent = cuenta('revisado');
  $('nObs').textContent = cuenta('observado');
  $('nNo').textContent = cuenta('nolisto');
  const sel = $('filtro');
  const previo = sel.value;
  const pisos = [...new Map(LAYOUT.map(d => [d.p, d.n])).entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
  sel.innerHTML = '<option value="">Todos los pisos</option>' + pisos.map(p => `<option value="${esc(p)}"${p === previo ? ' selected' : ''}>${esc(p)}</option>`).join('');
  const fe = $('filtroEstado').value;
  const vis = todos.filter(x => (!sel.value || x.d.p === sel.value) && (!fe || x.r.e === fe));
  if(!vis.length){
    $('lista').innerHTML = '<div class="vacio">No hay departamentos para mostrar con este filtro.</div>';
    return;
  }
  const grupos = {};
  vis.forEach(x => { (grupos[x.d.p] = grupos[x.d.p] || {n: x.d.n, items: []}).items.push(x); });
  const anim = primerPintado ? ' anim' : '';
  primerPintado = false;
  $('lista').innerHTML = Object.keys(grupos).sort((a, b) => grupos[b].n - grupos[a].n).map(p =>
    `<section class="piso"><h2>${esc(p)} · ${grupos[p].items.filter(x => x.r.e !== 'nolisto').length} de ${grupos[p].items.length} listos</h2><div class="lista">` +
    grupos[p].items.map(x => x.r.e === 'nolisto'
      ? `<div class="tile n${x.d.d === 'Pasillo' ? ' pas' : ''}${anim}" aria-disabled="true"><b>${esc(x.d.d)}</b><small>${falta(x.e)}</small></div>`
      : `<button type="button" class="tile ${claseEstado(x.r.e)}${x.d.d === 'Pasillo' ? ' pas' : ''}${anim}${espera[clave(x.d)] > Date.now() ? ' esperando' : ''}" data-k="${esc(clave(x.d))}"><b>${esc(x.d.d)}</b><small>${esc(etiqueta(x.r))}</small>${espera[clave(x.d)] > Date.now() ? `<i class="espera" style="animation-delay:-${ESPERA_MS - (espera[clave(x.d)] - Date.now())}ms"></i>` : ''}</button>`).join('') +
    '</div></section>').join('');
}

function fechaTxt(ts){
  return ts ? 'Terminado el ' + new Date(ts).toLocaleDateString('es-CL', {day:'2-digit', month:'short'}) : '';
}
function fechaHora(ts){
  return new Date(ts).toLocaleString('es-CL', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}

function elegir(e, foco){
  estadoSel = e;
  document.querySelectorAll('#mSeg button').forEach(b => b.classList.toggle('on', b.dataset.e === e));
  $('mObs').classList.toggle('oculto', e !== 'observado');
  $('mDet').tabIndex = $('mCant').tabIndex = e === 'observado' ? 0 : -1;
  $('mErr').textContent = '';
  if(e === 'observado' && foco) setTimeout(() => $('mDet').focus(), 230);
}

function abrir(k){
  if(espera[k] > Date.now()) return;
  const d = LAYOUT.find(x => clave(x) === k);
  if(!d) return;
  actual = d;
  const r = revision(d);
  $('mTit').textContent = d.p + ' · ' + (d.d === 'Pasillo' ? 'Pasillo' : 'Dpto ' + d.d);
  const partes = [fechaTxt(estado(d).ts)];
  if(r.ts) partes.push('Última modificación: ' + fechaHora(r.ts));
  $('mSub').textContent = partes.filter(Boolean).join(' · ');
  $('mDet').value = r.e === 'observado' ? r.d : '';
  $('mCant').value = r.e === 'observado' && r.c ? r.c : '';
  elegir(r.e);
  document.body.classList.add('bloq');
  $('vel').classList.add('on');
}

function cerrarModal(){
  const v = $('vel');
  if(!v.classList.contains('on') || v.classList.contains('out')) return;
  v.classList.add('out');
  setTimeout(() => { v.classList.remove('on', 'out'); document.body.classList.remove('bloq'); actual = null; }, 140);
}

async function guardarRevision(){
  if(!actual) return;
  const detalle = $('mDet').value.trim();
  const cantidad = Math.floor(Number($('mCant').value) || 0);
  if(estadoSel === 'observado' && !detalle){ $('mErr').textContent = 'Escribe qué está mal.'; return; }
  $('mGuardar').disabled = true; $('mCancel').disabled = true;
  try{
    const j = await llamar('calidadGuardar', {clave: clave(actual), estado: estadoSel, detalle, cantidad: estadoSel === 'observado' ? Math.max(1, cantidad) : 0, nonce: nuevoNonce(), ts: Date.now()});
    if(j && j.ok){
      const k = clave(actual);
      revisiones = j.revisiones || revisiones;
      marcarEspera(k);
      cerrarModal();
      pintar();
    }else{
      const msgs = {espera: 'Espera unos segundos antes de volver a modificar este departamento.', demasiadas: 'Demasiados cambios seguidos. Espera un minuto.', solicitud_invalida: 'Revisa la hora de tu equipo e intenta de nuevo.', repetida: 'La solicitud ya fue enviada.'};
      $('mErr').textContent = (j && msgs[j.error]) || 'No se pudo guardar. Intenta de nuevo.';
    }
  }catch(e){
    $('mErr').textContent = 'Sin conexión. Intenta de nuevo.';
  }finally{ $('mGuardar').disabled = false; $('mCancel').disabled = false; }
}

async function abrirRegistro(){
  const v = $('velReg');
  const lista = $('regLista');
  lista.innerHTML = '<div class="regvacio">Cargando…</div>';
  document.body.classList.add('bloq');
  v.classList.add('on');
  try{
    const j = await llamar('calidadRegistro');
    const reg = (j && j.ok && j.registro) || [];
    lista.innerHTML = reg.length ? reg.map(x => `<div class="regit"><b>${esc(x.celda)}</b><span class="cambio">${esc(x.antes)} → ${esc(x.despues)}</span><span class="meta">${esc(fechaHora(x.ts))} · ${esc(x.quien)} — Calidad</span></div>`).join('') : '<div class="regvacio">Aún no hay modificaciones registradas.</div>';
  }catch(e){
    lista.innerHTML = '<div class="regvacio">No se pudo cargar el registro.</div>';
  }
}
function cerrarRegistro(){
  const v = $('velReg');
  if(!v.classList.contains('on') || v.classList.contains('out')) return;
  v.classList.add('out');
  setTimeout(() => { v.classList.remove('on', 'out'); document.body.classList.remove('bloq'); }, 140);
}

async function cargar(){
  if(cargando || $('vel').classList.contains('on') || $('velReg').classList.contains('on')) return;
  cargando = true; $('refrescar').disabled = true;
  try{
    const j = await llamar('loadCalidad');
    if(j && j.ok){
      celdas = j.celdas || {};
      revisiones = j.revisiones || {};
      pintar();
      $('sub').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
    }else{
      $('sub').textContent = 'No se pudo cargar. Reintenta.';
    }
  }catch(e){
    $('sub').textContent = 'Sin conexión. Reintenta.';
  }finally{ cargando = false; $('refrescar').disabled = false; }
}

$('refrescar').addEventListener('click', cargar);
$('filtro').addEventListener('change', pintar);
$('filtroEstado').addEventListener('change', pintar);
$('lista').addEventListener('click', e => { const t = e.target.closest('.tile'); if(t) abrir(t.dataset.k); });
document.querySelectorAll('#mSeg button').forEach(b => b.addEventListener('click', () => elegir(b.dataset.e, true)));
$('verRegistro').addEventListener('click', abrirRegistro);
$('regCerrar').addEventListener('click', cerrarRegistro);
$('mCancel').addEventListener('click', cerrarModal);
$('mGuardar').addEventListener('click', guardarRevision);
document.addEventListener('keydown', e => { if(e.key === 'Enter' && $('vel').classList.contains('on') && e.target.tagName === 'INPUT') guardarRevision(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) cargar(); });
setInterval(() => { if(!document.hidden) cargar(); }, 60000);

(function(){
  const m = {name:'Calidad · Obra Bellavista', short_name:'Calidad', start_url: location.href.split('#')[0], display:'standalone', background_color:'#0f2f3b', theme_color:'#0f2f3b'};
  try{
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
})();

cargar();
</script>
</body>
</html>
